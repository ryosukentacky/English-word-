const cards=[{"name": "general", "text": "**general** ですね。英単語として、いつもの形式で解説します。"}, {"name": "particular", "text": "## particular /pərˈtɪkjələr/\n**読み方：パティキュラー（パーティキュラー）**\n\n「先輩、**particular** はちょっと厄介ですよ。  \n『特定の』と覚えて終わると、**specific** と区別できなくなりますから。」\n\n「先に核を言いますね。」\n\n> **particular = たくさんある中から「これ」と取り出して意識する**\n\nこのイメージです。\n\n---\n\n# A【要点｜まず全体を掴みましょう】\n\n「たとえば、机の上に本が10冊あるとします。」\n\n📚 📚 📚 📚 📚 📚 📚 📚 📚 📚\n\n「私が先輩に――」\n\n> **I'm looking for a particular book.**\n\n「と言ったらどうでしょう？」\n\n「『本なら何でもいい』じゃありません。」\n\n**たくさんの本**\n↓  \n**その中の「ある特定の一冊」**\n↓  \n🎯 **particular book**\n\n「そうです。これが particular の基本です。」\n\n### 核イメージ\n\n**いろいろある中から「これ」と特定して意識する**\n\nそこから、\n\n- **特定の**\n- **特別な**\n- **特に**\n- **好みがうるさい**\n\nなどの意味につながります。\n\n「え？ 『好みがうるさい』まで行くんですか？」\n\n「はい。そこもちゃんとつながります。後で説明しますから、先走らないでください。」\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n### ①「特定の」\n\n> **I have a particular reason for doing this.**  \n> 私にはこれをする**特定の理由**があります。\n\n「理由はいろいろ考えられますよね。」\n\nお金？  \n仕事？  \n家族？  \n将来？\n\n「でも話している人には、**『この理由』というものがある**。」\n\nいろいろある  \n↓  \n一つに意識を向ける  \n↓  \n🎯 **particular reason**\n\nということです。\n\n---\n\n### ② particularly「特に」\n\n「ここから **particularly** も一緒に覚えましょう。」\n\n> **I particularly like this song.**  \n> 私は**特に**この曲が好きです。\n\n「曲が100曲あったとして、その中でも――」\n\n🎵🎵🎵🎵🎵  \n　　↓  \n　　🎯  \n**この曲が特に好き**\n\n「だから **particularly = 特に、とりわけ** になるんです。」\n\n---\n\n### ③ be particular about ～「～にこだわる・好みがうるさい」\n\n「はい、ここが面白いところですよ。」\n\n> **He is particular about food.**\n\n直訳っぽく「彼は食べ物について特定です」……\n\n「……先輩、それはダメです。」\n\nこれは、\n\n> **彼は食べ物にこだわりがある。**  \n> **彼は食べ物の好みにうるさい。**\n\nという意味です。\n\n「どうしてこうなると思います？」\n\n……\n\n「particular の人は、何でも『まあこれでいいか』とはしません。」\n\n🍛「これでもいい」  \n🍜「これでもいい」\n\nではなく、\n\n🔎「これはいい」  \n🔎「これはダメ」  \n🔎「この材料じゃないと嫌」\n\nと**細かく選び分ける**。\n\nだから、\n\n**be particular about ～**  \n→ ～について細かく選ぶ  \n→ ～にこだわる  \n→ ～の好みにうるさい\n\nとなるんです。\n\n---\n\n# C【イメージ理解｜一回、想像してください】\n\n「先輩、一緒にカフェに来たとしましょう。」\n\n私が、\n\n「何飲みます？」\n\nと聞きます。\n\n先輩が、\n\n「何でもいい。」\n\nと言ったら……\n\nこれは **particular ではありません**。\n\nでも、\n\n「豆はエチオピア産で、浅煎りで、酸味があって、温度は――」\n\n「……先輩？」\n\n「そこまで指定するなら、かなり **particular** です。」\n\nつまり、\n\n### particular の世界\n\n☕ コーヒーなら何でもいい  \n→ particular ではない\n\n☕☕☕☕☕  \n　　　↓  \n🎯 **これがいい**\n\n→ **particular**\n\n「**選択肢の中から特定のものへ意識を向ける**。この感覚を残してください。」\n\n---\n\n# D【具体例｜実際の英文で見ましょう】\n\n### ① particular person\n\n> **Is there any particular person you want to meet?**\n\n「特に会いたい人はいますか？」\n\n「誰でもいいですか？」ではなく、\n\n**『この人に会いたい』という人がいる？**\n\nと聞いています。\n\n---\n\n### ② no particular reason\n\nこれ、かなり使えます。\n\n> **I did it for no particular reason.**\n\n**「特に理由もなく、それをしました。」**\n\n「理由が完全にゼロ」というより、\n\n**『これという特定の理由はない』**\n\nという感覚ですね。\n\n---\n\n### ③ this particular problem\n\n> **We need to solve this particular problem.**\n\n**「この特定の問題を解決する必要があります。」**\n\n問題A  \n問題B  \n問題C  \n問題D  \n　↓  \n🎯 **この問題**\n\nという感じです。\n\n---\n\n# 【類義語｜specificとの違い】\n\n「はい先輩。ここが今日の本番です。」\n\n## particular vs specific\n\n| 単語 | 核イメージ |\n|---|---|\n| **particular** | 🎯 多数の中から「これ」と取り出す |\n| **specific** | 🔍 曖昧にせず、具体的・明確に絞る |\n| **certain** | 👤 ある～・特定の～（明示しない） |\n| **special** | ⭐ 普通とは違う・特別 |\n| **individual** | 👤 集団ではなく一つ一つの個体 |\n\n### particular\n\n> **I want this particular book.**\n\n**「ほかではなく、この本が欲しい。」**\n\n📚📚📚🎯📚\n\n**選択肢の中の「これ」**がポイント。\n\n### specific\n\n> **Please give me a specific reason.**\n\n**「具体的な理由を教えてください。」**\n\n「なんとなく嫌だから」ではなく、\n\n🔍 **具体的に何が理由なの？**\n\nという感じ。\n\nつまり、\n\n**particular**  \n→ **どれ？ → これ。🎯**\n\n**specific**  \n→ **具体的には？ → これです。🔍**\n\n「似ていますけど、視点が違うんです。」\n\n---\n\n### certain\n\n> **A certain person told me about it.**\n\n**「ある人がそれについて教えてくれました。」**\n\n誰なのか話し手には分かっていても、**あえて具体的に名前を出していない**感じがあります。\n\n🎯 particular  \n→ 他ではなく「その特定のもの」\n\n👤 certain  \n→ 「ある～」としてぼかして示す\n\n---\n\n### special\n\n> **This is a special day for me.**\n\n**「今日は私にとって特別な日です。」**\n\nこれは「候補の中から特定する」というより、\n\n⭐ **普通とは違って特別な価値がある**\n\nです。\n\n「だから **particular = special** と丸暗記しないでくださいね。」\n\n---\n\n# 【よく使う表現】\n\n**in particular**\n\n> **I like Japanese food, sushi in particular.**\n\n「私は日本食が好きです。**特に寿司が好きです。**」\n\n日本食  \n├ ラーメン  \n├ うどん  \n├ 天ぷら  \n└ 🎯 **寿司 ← とりわけこれ**\n\nだから、\n\n> **in particular = 特に・とりわけ**\n\nです。\n\n---\n\n**nothing in particular**\n\n> **What are you doing?**  \n> **Nothing in particular.**\n\n「何してるの？」\n\n**「別に何も。」  \n「特に何もしてないよ。」**\n\n日常会話で便利ですよ。\n\n---\n\n# 【理解確認】\n\n「先輩、本当に **general** との関係まで分かりました？」\n\n「……では3問です。」\n\n### Q1\n\n**particular の核イメージは？**\n\nA. 全体を広く見る  \nB. 多数の中から「これ」と取り出す  \nC. よく起こる\n\n……\n\n**Bです。**\n\n---\n\n### Q2\n\n> **I'm particular about coffee.**\n\nこれは？\n\n……\n\n**「私はコーヒーにこだわりがある。」**\n\nですね。\n\n---\n\n### Q3\n\n**general と particular のイメージの違いは？**\n\n……\n\n「そうです。」\n\n🌏 **general**  \n→ 全体を広く見る\n\n🎯 **particular**  \n→ その中の特定のものを見る\n\n「この対比、かなり大事ですよ。」\n\n---\n\n# 【30秒復習】\n\n① **particular**  \n→ 特定の・特別な\n\n② 核イメージ  \n→ 🎯 **多数の中から「これ」と取り出す**\n\n③ **in particular**  \n→ 特に・とりわけ\n\n④ **be particular about ～**  \n→ ～にこだわる・～の好みにうるさい\n\n⑤ **nothing in particular**  \n→ 特に何もない\n\n⑥ **specificとの違い**  \n→ particular＝**どれ？ → これ🎯**  \n→ specific＝**具体的には？ → これ🔍**\n\n# 【一文で覚える】\n\n> **particular =「いろいろあるけど、その中でも“これ”」🎯**\n\n「先輩、さっきの **general** とセットにしてください。」\n\n**general 🌏 全体を見る**  \n↕  \n**particular 🎯 その中の特定のものを見る**\n\n「この2つを映像で対比できれば、『一般的な』『特定の』という日本語だけで覚えるより、ずっと使いやすくなりますよ。」"}, {"name": "vital", "text": "vital /ˈvaɪtəl/\n\n読み方：ヴァイタル\n\n「先輩、vital は important の強化版みたいに覚えたくなるんですけど……それだけだと少し惜しいです。」\n\nvital =「それがないと成り立たない」ほど重要\n\nこの感覚を掴みましょう。\n\nA【要点｜まず全体を掴みましょう】\n\n「まず vital の核には life（生命） のイメージがあります。」\n\nだから元々、\n\nvital organs\n生命維持に不可欠な臓器\n\nのように使えます。\n\nそこから意味が広がって、\n\n生命に関わる\n↓\nなくなると困る\n↓\n成り立たなくなる\n↓\n極めて重要な・不可欠な\n\nとなります。\n\nたとえば、\n\nSleep is vital for good health.\n睡眠は健康にとって極めて重要です。\n\n「睡眠はちょっと重要ですよ」程度ではありません。\n\n健康を維持するために欠かせないという強さがあります。\n\nB【詳しい解説｜なぜそうなるの？】\n\n「先輩、会社に100個くらい仕事があるとしましょう。」\n\nその中には、\n\n「やった方がいい仕事」\n\nもありますよね。\n\nこれは important で十分かもしれません。\n\nでも、\n\n「これが止まったら会社の事業そのものが動かない」\n\nとなったら？\n\n……\n\n「そうです。そこで vital がしっくりきます。」\n\nCommunication is vital to our business.\nコミュニケーションは私たちの事業にとって不可欠です。\n\nつまり、\n\n重要\n↓\nだけではなく\n↓\nそれが機能するために欠かせない\n↓\n❤️ vital\n\nなんです。\n\n「なので、単純に very important = vital とだけ覚えないでくださいね。」\n\nC【イメージ理解｜一回、想像してください】\n\n「先輩、スマホを想像してください。」\n\n📱ケース\n📱壁紙\n📱ストラップ\n📱バッテリー\n\n「全部同じ重要度でしょうか？」\n\n……違いますよね。\n\nケースがなくてもスマホは動きます。\n\nでも、バッテリーが完全になくなったら？\n\n📱→ 🪫 → 動かない。\n\n「はい。こっちが vital のイメージです。」\n\nつまり、\n\nあると良いものではなく、\n\n❤️ これがないと機能しない\n\nこれが vital の感覚です。\n\nD【具体例｜英文で確認しましょう】\n① vital information\n\nThis is vital information.\n\n「これは極めて重要な情報です。」\n\n単に「知っておいた方がいい情報」ではなく、判断や行動に欠かせないほど重要な情報というニュアンスです。\n\n② vital role\n\nShe plays a vital role in the team.\n\n「彼女はチームで極めて重要な役割を果たしています。」\n\n「いてくれたら嬉しい」より強く、\n\nチームが機能するうえで欠かせない役割\n\nというイメージですね。\n\n③ vital to / vital for\n\nWater is vital for life.\n\n「水は生命に不可欠です。」\n\nこれは分かりやすいでしょう？\n\n水が、\n\n「あるとちょっと便利」\n\nなわけじゃありません。\n\n生命維持に必要だから vital です。\n\n【類義語｜important・essential・crucialとの違い】\n\n「はい先輩。ここが一番大事です。」\n\n単語\t核イメージ\t強調点\nimportant\t⭐ 重要\t最も一般的\nvital\t❤️ ないと成り立たない\t生命・機能維持\nessential\t🧩 構成上欠かせない\t必須要素\ncrucial\t⚖️ 結果を左右する\t決定的\nsignificant\t📈 無視できない\t影響・意味が大きい\n\n「似ていますけど、頭の中の映像を変えてください。」\n\nimportant ⭐\n\nThis is an important meeting.\nこれは重要な会議です。\n\n一番広く使える「重要」。\n\nvital ❤️\n\nWater is vital for survival.\n水は生存に不可欠です。\n\nないと維持できない。\n\nessential 🧩\n\nPractice is essential for improvement.\n上達には練習が不可欠です。\n\n完成させるための必須パーツという感覚。\n\ncrucial ⚖️\n\nThis decision is crucial to our success.\nこの決定は成功にとって極めて重要です。\n\n「この判断で成功か失敗かが変わるぞ」という、結果を左右する分岐点の感覚です。\n\nsignificant 📈\n\nThere has been a significant increase in sales.\n売上が大幅に増加しました。\n\n無視できないほど大きい・意味があることを強調します。\n\n【ここだけは区別】\n\n「先輩、4つ並べるとこうです。」\n\nimportant ⭐\n→ 大事\n\nessential 🧩\n→ 必須パーツ\n\nvital ❤️\n→ ないと機能・維持できない\n\ncrucial ⚖️\n→ 結果を左右する\n\nたとえば会社なら、\n\nGood communication is important.\n良いコミュニケーションは重要。\n\nよりも、\n\nGood communication is vital.\n\nとすると、\n\n「会社・チームを機能させるために欠かせない」\n\nという強いニュアンスになります。\n\n【理解確認】\n\n「先輩、3問だけですよ。」\n\nQ1\n\nvital の核イメージは？\n\nA. よくある\nB. ないと成り立たないほど重要\nC. 珍しい\n\n……\n\nBです。❤️\n\nQ2\n\nvital と crucial の違いは？\n\n……\n\nvital ❤️\n→ 維持・機能するために欠かせない\n\ncrucial ⚖️\n→ 結果を大きく左右する\n\n「はい。ここまで言えれば十分です。」\n\nQ3\n\nExercise is vital for maintaining good health.\n\nは？\n\n「運動は健康を維持するために極めて重要です。」\n\nですね。\n\n【30秒復習】\n\n① vital\n→ 極めて重要な・不可欠な\n\n② 発音\n→ ヴァイタル\n\n③ 核イメージ\n→ ❤️ ないと維持・機能できない\n\n④ vital role\n→ 不可欠な役割\n\n⑤ vital information\n→ 極めて重要な情報\n\n⑥ crucialとの違い\n→ vital＝維持に不可欠 ❤️\n→ crucial＝結果を左右 ⚖️\n\n【一文で覚える】\n\nvital =「これがなくなったら、ちゃんと成り立たない」❤️\n\n「先輩、以前やった essential / crucial / significant と全部『重要』でまとめないでくださいね。」\n\nimportant ⭐ 大事\nessential 🧩 必須\nvital ❤️ 維持に不可欠\ncrucial ⚖️ 結果を左右\nsignificant 📈 無視できないほど大きい\n\n「この5つ、英語ではちゃんと景色が違います。そこまで分けられたら、かなり使い分けやすくなりますよ。」"}, {"name": "essential", "text": "## essential /ɪˈsenʃəl/\n**読み方：エセンシャル**\n\n「先輩、さっきの **vital** とセットで覚えるにはちょうどいい単語ですね。」\n\nでも、どちらも「不可欠な」と訳せるので、\n\n> **essential = vital = 不可欠**\n\nで終わらせるのは禁止です。\n\n**essential の核イメージは――**\n\n> 🧩 **「それを成立させるための、絶対に外せない基本要素」**\n\nです。\n\n# A【要点｜まず全体を掴みましょう】\n\n「先輩、パズルを想像してください。」\n\n🧩🧩🧩  \n🧩⬜🧩  \n🧩🧩🧩\n\n「真ん中のピースがありません。」\n\n完成してます？\n\n……してませんよね。\n\nこの、\n\n> **完成・目的達成のために欠かせないピース**\n\nが **essential** のイメージです。\n\n### essential\n**必要不可欠な / 必須の / 本質的な**\n\nたとえば、\n\n> **Water is essential for life.**  \n> 水は生命に**不可欠です**。\n\nつまり、\n\n**目的・状態がある**\n↓  \nそれを成立させるには○○が必要\n↓  \n○○を抜くと成立しない\n↓  \n🧩 **essential**\n\nです。\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n「たとえば先輩が英語を上達させたいとします。」\n\n英語上達に必要そうなものを並べましょう。\n\n📱 高価なタブレット  \n✏️ おしゃれなノート  \n🎧 高級イヤホン  \n📚 継続的な学習\n\n「さて、全部 **essential** ですか？」\n\n……\n\n「違いますね。」\n\n高級イヤホンがなくても英語は勉強できます。\n\nでも、\n\n> **Regular practice is essential for improving your English.**\n\n**「英語を上達させるには、継続的な練習が不可欠です。」**\n\nこれは、\n\n**英語を上達する**\n↓  \nそのために練習が必要\n↓  \n練習を抜いて上達するのは難しい\n↓  \n🧩 **essential**\n\nという流れです。\n\n「つまり **essential** は単に『すごく大事』と言っているだけではありません。」\n\n**「それ、抜けます？」**\n\nと考えて、\n\n**抜いたら目的を成立させにくい**\n\nなら essential の感覚に近いんです。\n\n---\n\n# C【イメージ理解｜料理で考えましょう】\n\n「先輩、カレーを作るとします。」\n\n🍛\n\nお皿を高級ブランドにする。\n\n「……これは？」\n\nなくてもいいですね。\n\nパセリをきれいに飾る。\n\n「これは？」\n\nこれもなくても作れます。\n\nでも、カレーを作るための**中心となる材料**まで全部抜いたら？\n\n「もう……何を作るつもりなんですか。」\n\nつまり、\n\n**あると良い**\n→ optional\n\n**成立させるために必要**\n→ 🧩 **essential**\n\nです。\n\nだから、\n\n> **essential ingredient**\n\nなら、\n\n**欠かせない材料・必須要素**\n\nという意味になります。\n\n---\n\n# D【具体例｜実際の英文で確認します】\n\n### ① essential information\n\n> **Please provide all essential information.**\n\n**「必要不可欠な情報をすべて提供してください。」**\n\n何でもかんでも情報を出して、というより、\n\n**手続きなどを成立させるために必要な情報**\n\nというイメージです。\n\n---\n\n### ② essential skills\n\n> **Communication skills are essential for this job.**\n\n**「この仕事にはコミュニケーション能力が不可欠です。」**\n\n仕事をきちんと行うための、\n\n🧩 **欠かせない能力**\n\nですね。\n\n---\n\n### ③ It is essential to ～\n\nこれは形ごと覚えてください。\n\n> **It is essential to check the details.**\n\n**「詳細を確認することが不可欠です。」**\n\n**It is essential to + 動詞**\n→ **～することが不可欠だ**\n\nです。\n\n---\n\n### ④ 名詞の essential\n\n「実は essential は名詞でも使えます。」\n\n> **the essentials**\n\n**「必要不可欠なもの・必需品・要点」**\n\nたとえば、\n\n> **Pack only the essentials.**\n\n**「必要最低限のものだけ荷造りしてください。」**\n\n「旅行にゲーム機5台とか持っていこうとしないでくださいね？」\n\n---\n\n# 【類義語｜ここが今日の本番です】\n\n「先輩、**essential / vital / crucial / necessary / important** を整理します。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **important** | ⭐ 大事 |\n| **necessary** | ✅ 必要 |\n| **essential** | 🧩 成立に欠かせない要素 |\n| **vital** | ❤️ 機能・生命の維持に不可欠 |\n| **crucial** | ⚖️ 結果を左右するほど重要 |\n\n## important ⭐\n\n> **English is important for my job.**\n\n**英語は仕事にとって重要です。**\n\n一番普通の「重要」です。\n\n---\n\n## necessary ✅\n\n> **A passport is necessary for international travel.**\n\n**海外旅行にはパスポートが必要です。**\n\n**necessary** はシンプルに、\n\n> **必要条件として必要**\n\nという感覚。\n\n---\n\n## essential 🧩\n\n> **Trust is essential for a good relationship.**\n\n**良い関係には信頼が不可欠です。**\n\n「良い関係」というものを成立させる**基本要素**として信頼が必要、という感覚です。\n\n---\n\n## vital ❤️\n\n> **Water is vital for survival.**\n\n**水は生存に不可欠です。**\n\n「生き続ける・機能し続けるために必要」という**生命・維持**の感覚が強いです。\n\n---\n\n## crucial ⚖️\n\n> **The next decision will be crucial.**\n\n**次の決断が極めて重要になります。**\n\nなぜ？\n\nその判断によって、\n\n成功 ← ⚖️ → 失敗\n\n**結果が大きく変わる可能性があるから**です。\n\n---\n\n# 【essential と vital の違い】\n\n「さっき **vital** をやったので、ここは絶対つなげてください。」\n\n### essential 🧩\n\n**「これ、必要な構成要素ですよね？」**\n\n→ 成立に欠かせない\n\n### vital ❤️\n\n**「これがなくなったら維持できませんよね？」**\n\n→ 生存・機能・継続に不可欠\n\nたとえば、\n\n> **Exercise is essential for a healthy lifestyle.**\n\nなら、\n\n🧩 **健康的な生活を構成する重要な要素**\n\nという感じ。\n\n> **Oxygen is vital for human life.**\n\nなら、\n\n❤️ **酸素がなければ生命を維持できない**\n\nという感じです。\n\n「ただし先輩、ここは注意です。」\n\n実際の英語では **essential と vital の意味はかなり重なります**。\n\nいつでも機械的に、\n\n「これは構成要素だから絶対 essential！」\n\nと分けられるわけではありません。\n\nこの🧩と❤️は、**ニュアンスを理解するための中心イメージ**だと思ってください。\n\n---\n\n# 【理解確認】\n\n「はい先輩。3問だけです。」\n\n### Q1\n\n**essential の核イメージは？**\n\nA. よく見かける  \nB. 成立に欠かせない基本要素  \nC. 結果を左右する\n\n……\n\n**Bです。🧩**\n\n### Q2\n\n> **Sleep is essential for good health.**\n\nこれは？\n\n……\n\n**「良い健康状態には睡眠が不可欠です。」**\n\nつまり睡眠を、\n\n🧩 **健康を成立・維持するために欠かせない要素**\n\nとして見ています。\n\n### Q3\n\n**essential と crucial の違いは？**\n\n……\n\n**essential 🧩**\n→ 成立に欠かせない\n\n**crucial ⚖️**\n→ 結果を大きく左右する\n\n「はい。そこが分かっていれば大丈夫です。」\n\n---\n\n# 【30秒復習】\n\n① **essential**  \n→ 必要不可欠な・必須の\n\n② 発音  \n→ **エセンシャル**\n\n③ 核イメージ  \n→ 🧩 **成立に欠かせない基本要素**\n\n④ **It is essential to ～**  \n→ ～することが不可欠\n\n⑤ **the essentials**  \n→ 必需品・必要不可欠なもの\n\n⑥ **vitalとの違い**  \n→ essential 🧩＝**成立に欠かせない**  \n→ vital ❤️＝**維持・生命に不可欠**\n\n⑦ **crucialとの違い**  \n→ crucial ⚖️＝**結果を左右する**\n\n# 【一文で覚える】\n\n> **essential =「これを抜いたら成立しない、必須ピース」🧩**\n\n「先輩、ここまで来たら『重要シリーズ』を日本語一語で覚えないでください。」\n\n**important ⭐ → 大事**  \n**necessary ✅ → 必要**  \n**essential 🧩 → 成立に欠かせない**  \n**vital ❤️ → 維持に欠かせない**  \n**crucial ⚖️ → 結果を左右する**  \n**significant 📈 → 無視できないほど意味・影響が大きい**\n\n「特に **essential 🧩 / vital ❤️ / crucial ⚖️**。この3つの映像を分けておけば、英文で出てきたときにニュアンスまで拾えますよ。」"}, {"name": "crucial", "text": "## crucial /ˈkruːʃəl/\n**読み方：クルーシャル**\n\n「先輩、来ましたね。**essential → vital → crucial**。」\n\n全部「非常に重要な」と訳せますけど、**crucial は見ている場所が違います。**\n\n> ⚖️ **crucial =「ここで結果が決まる」ほど重要**\n\n成功するか失敗するか。勝つか負けるか。  \n**結果を大きく左右するポイント**、というのが核イメージです。\n\n---\n\n# A【要点｜まず全体を掴みましょう】\n\n「先輩、サッカーの試合を想像してください。」\n\n90分戦って、\n\n**1－1**\n\n残り時間わずか。\n\nそしてPK。\n\n⚽　🥅\n\n「このPK、ただ *important* なだけでしょうか？」\n\n……もっと重いですよね。\n\n**入る**\n→ 勝つ可能性が一気に高まる\n\n**外す**\n→ 勝敗が変わるかもしれない\n\nだから、\n\n> **a crucial moment**  \n> **決定的に重要な瞬間**\n\nと言えます。\n\nつまり、\n\n**何か重要な場面がある**\n↓  \nそこでの出来事・判断によって\n↓  \nその後の結果が大きく変わる\n↓  \n⚖️ **crucial**\n\nです。\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n「仕事で考えてみましょう。」\n\n先輩が新商品のプロジェクトを担当しているとします。\n\n企画  \n↓  \n開発  \n↓  \nテスト  \n↓  \n発売\n\nこの中で、発売直前に重大な問題が見つかった。\n\nそして、\n\n**このまま発売する？  \n延期する？**\n\nという判断を迫られました。\n\n「この判断によって何が変わります？」\n\n……\n\nそうですね。\n\n延期する  \n→ コストが増えるかもしれない  \n→ でも品質問題を防げるかもしれない\n\nそのまま発売する  \n→ 予定通り売れる  \n→ でも重大な不具合が出るかもしれない\n\nつまり、\n\n**判断**\n↓\n⚖️\n↓\n**結果が大きく変わる**\n\nだから、\n\n> **This is a crucial decision.**\n\n**「これは極めて重要な決断です。」**\n\nとなるんです。\n\n「ただ『大事な決断』じゃありません。」\n\n**この決断が今後を左右する。**\n\nそこまで感じてください。\n\n---\n\n# C【イメージ理解｜分かれ道です】\n\n「先輩、山道を歩いているとしましょう。」\n\n途中で道が二つに分かれました。\n\n　　　　　　🏠目的地  \n　　　　　↗  \n🚶 → ⚖️  \n　　　　　↘  \n　　　　　　❌行き止まり\n\n「ここでどっちに進むかって……？」\n\n重要ですよね。\n\nなぜなら、\n\n**今ここで選ぶ**\n↓\n進むルートが変わる\n↓\n最終結果が変わる\n\nからです。\n\nこれが **crucial** の感覚です。\n\n> ⚖️ **「この一点が、その後を左右する」**\n\n「先輩、crucial を見たら頭の中に**分岐点**を出してください。」\n\n---\n\n# D【具体例｜実際の英文で見ましょう】\n\n### ① crucial decision\n\n> **We have to make a crucial decision.**\n\n**「私たちは極めて重要な決断をしなければなりません。」**\n\nただ重要なのではなく、\n\n**この決断次第で結果が変わる**\n\nというニュアンスです。\n\n---\n\n### ② crucial role\n\n> **She played a crucial role in the project's success.**\n\n**「彼女はプロジェクトの成功に極めて重要な役割を果たしました。」**\n\nここ、注目です。\n\n**project's success** とありますよね。\n\n彼女の働きが、\n\n→ プロジェクトの成功に  \n→ 大きな影響を与えた\n\nだから **crucial role** なんです。\n\n---\n\n### ③ crucial moment\n\n> **He made a mistake at a crucial moment.**\n\n**「彼は決定的に重要な場面でミスをしました。」**\n\nたとえば試合終了直前。\n\n🏀 98－98  \n残り3秒\n\nそこでミス。\n\n「……これは痛いですね。」\n\n普通の時間帯のミスより、**試合結果を左右する可能性が高い**。\n\nだから **crucial moment** です。\n\n---\n\n### ④ crucial to / crucial for\n\n> **Communication is crucial to the success of the project.**\n\n**「コミュニケーションはプロジェクトの成功に極めて重要です。」**\n\nよく、\n\n> **be crucial to ～**  \n> ～にとって極めて重要である\n\nという形で出てきます。\n\n---\n\n# 【類義語｜important・essential・vitalとの違い】\n\n「はい先輩。ここ、今回の本番ですよ。」\n\n| 単語 | 核イメージ | 頭の中の絵 |\n|---|---|---|\n| **important** | 普通に重要 | ⭐ |\n| **essential** | 成立に欠かせない | 🧩 |\n| **vital** | 維持・生命に不可欠 | ❤️ |\n| **crucial** | 結果を大きく左右する | ⚖️ |\n| **critical** | 成否を左右する重大な局面 | 🚨 |\n| **significant** | 無視できない意味・影響がある | 📈 |\n\n---\n\n## essential 🧩 vs crucial ⚖️\n\n「たとえば勉強なら――」\n\n> **Practice is essential for improvement.**\n\n**練習は上達に不可欠です。**\n\n🧩 練習という**必要な要素**がないと上達しにくい。\n\n一方、\n\n> **The final exam is crucial for your grade.**\n\n**期末試験は成績にとって極めて重要です。**\n\n⚖️ **この試験の結果によって最終成績が大きく変わる。**\n\nつまり、\n\n**essential 🧩**\n→ 「これ、必要？」\n\n**crucial ⚖️**\n→ 「これで結果が変わる？」\n\nです。\n\n---\n\n## vital ❤️ vs crucial ⚖️\n\n> **Water is vital for survival.**\n\n❤️ **生存を維持するために水は不可欠。**\n\n一方、\n\n> **The next 24 hours will be crucial.**\n\n⚖️ **今後24時間が、その後の結果を大きく左右する。**\n\n「分かってきました？」\n\n**vital**\n→ 維持できるか\n\n**crucial**\n→ 結果がどうなるか\n\nに視点があります。\n\nただし、実際には **vital / essential / crucial** は意味が重なる場面も多いので、この違いを絶対的なルールだとは考えないでくださいね。\n\n---\n\n# 【criticalとの違い】\n\n「先輩、もう一つ。**critical** も似ています。」\n\n### crucial ⚖️\n**結果を左右する重要ポイント**\n\n> **This is a crucial decision.**\n\n「この決断が結果を左右する。」\n\n### critical 🚨\n**非常に重大で、成否・安全などがかかった局面**\n\n> **The patient is in critical condition.**\n\n**「患者は危篤状態です。」**\n\nこれは crucial に置き換える話ではありません。\n\ncritical には文脈によって、**危機的・重大な**という意味があります。\n\n---\n\n# 【理解確認】\n\n「はい先輩。今回は絶対、**essential / vital / crucial** を比較して終わります。」\n\n### Q1\n\n**crucial の核イメージは？**\n\nA. 成立に必要なパーツ  \nB. 結果を大きく左右する  \nC. よくある\n\n……\n\n**Bです。⚖️**\n\n---\n\n### Q2\n\n> **This is a crucial moment.**\n\nなぜ *crucial*？\n\n……\n\n「そうです。」\n\n**この瞬間の出来事によって、その後の結果が大きく変わるから。**\n\n---\n\n### Q3\n\nでは、\n\n**essential / vital / crucial**\n\nを一言ずつ説明すると？\n\n……\n\nはい、こうです。\n\n**essential 🧩**\n→ 成立に欠かせない\n\n**vital ❤️**\n→ 維持・生命に欠かせない\n\n**crucial ⚖️**\n→ 結果を左右する\n\n「はい。ここまで区別できたら十分です。」\n\n---\n\n# 【30秒復習】\n\n① **crucial**  \n→ 極めて重要な・決定的な\n\n② 発音  \n→ **クルーシャル**\n\n③ 核イメージ  \n→ ⚖️ **ここで結果が変わる**\n\n④ **crucial decision**  \n→ 結果を左右する重要な決断\n\n⑤ **crucial moment**  \n→ 決定的に重要な瞬間\n\n⑥ **be crucial to ～**  \n→ ～にとって極めて重要\n\n⑦ essentialとの違い  \n→ 🧩 **必要な要素** vs ⚖️ **結果を左右**\n\n---\n\n# 【一文で覚える】\n\n> **crucial =「ここが分かれ道。これ次第で結果が変わる」⚖️**\n\n「先輩、これで3つがきれいにつながりましたね。」\n\n**essential 🧩**  \n→ 「これを抜いたら成立しない」\n\n**vital ❤️**  \n→ 「これがないと維持できない」\n\n**crucial ⚖️**  \n→ **「これ次第で結果が変わる」**\n\n「全部『不可欠・重要』で暗記するより、この3枚の絵で覚えてください。英文を読んだとき、書き手が**何を重要だと感じているのか**まで見えるようになりますよ。」"}, {"name": "significance", "text": "significance /sɪɡˈnɪfɪkəns/\n\n読み方：シグニフィカンス\n\n「先輩、たぶん significance ですね。スペルは significance です。」\n\nこれ、さっきの significant と必ずセットで覚えてください。\n\nsignificant（形容詞）＝ 重要な・意味のある・無視できないほど大きな\nsignificance（名詞）＝ 重要性・意義・意味\n\nでも「重要性」で丸暗記すると importance との違いが消えます。\n\nsignificance の核イメージは――\n\n💡 「それには、見過ごせない意味・重要性がある」\n\nです。\n\nA【要点｜まず全体を掴みましょう】\n\n「たとえば、会社の売上が昨日より 1円 増えました。」\n\n+1円。\n\n「……まあ、増えてはいます。」\n\nでも、その変化に大きな意味がありますか？\n\n「ほぼないですよね。」\n\nでは、\n\n売上100万円 → 300万円\n\nになったら？\n\n「これは『何が起きたんだ？』ってなりますよね。」\n\n📈 大きな変化\n↓\n無視できない\n↓\n何らかの意味・重要性がある\n↓\n💡 significance\n\nです。\n\nsignificance\n\n重要性・意義・意味\n\nthe significance of the discovery\nその発見の重要性・意義\n\nという感じですね。\n\nB【詳しい解説｜なぜそうなるの？】\n\n「先輩、significance には sign が入っていますよね。」\n\n細かい語源暗記は置いておいて、イメージとして、\n\n🚨 「これは何か意味があるぞ」と知らせるサイン\n\nと考えると覚えやすいです。\n\nたとえば研究で、ある新しい発見がありました。\n\n最初は、\n\n「へえ、新しいものが見つかったんだ。」\n\nだけかもしれません。\n\nでも、その発見によって、\n\n新しい治療法につながる\n↓\n多くの患者に影響する\n↓\n医学そのものが進歩する可能性がある\n\nとなったら？\n\n「……単なる発見じゃないですよね。」\n\nその発見には、\n\n見過ごせない意味・重要性がある。\n\nだから、\n\nthe significance of this discovery\n\n「この発見の重要性・意義」\n\nとなります。\n\nC【イメージ理解｜一回、想像してください】\n\n「先輩、朝起きて体重を測ったとします。」\n\n昨日\n\n70.00kg\n\n今日\n\n69.99kg\n\n「0.01kg減りました！」\n\n……。\n\n「先輩、それで大騒ぎしないでください。」\n\n誤差かもしれませんよね。\n\nつまり、\n\n変化はある\n↓\nでも小さすぎる\n↓\n特別な意味を読み取れない\n\nという状態です。\n\nところが、長期間で\n\n70kg → 60kg\n\nとなったら、\n\n「これは無視できません。」\n\n何か理由があるかもしれない。\n\nつまり、\n\n見過ごせない → 意味を持つ\n\nこの「意味・重要性」が significance です。\n\nD【具体例｜英文で確認しましょう】\n① the significance of ～\n\n非常によく使います。\n\nWe need to understand the significance of this change.\n\n「私たちはこの変化の重要性・意味を理解する必要があります。」\n\n単に、\n\n「変化したね」\n\nではありません。\n\nその変化が何を意味しているのか？\n\nまで考えています。\n\n② historical significance\n\nThis building has great historical significance.\n\n「この建物には大きな歴史的意義があります。」\n\n「建物が大きい」とか「古い」だけではなく、\n\n🏛️ 重要な出来事が起きた\n↓\n歴史を理解するうえで意味がある\n↓\nhistorical significance\n\nです。\n\n③ significance to ～\n\nThis event has special significance to me.\n\n「この出来事は私にとって特別な意味があります。」\n\nたとえば、初めて仕事に採用された日。\n\n他人から見れば普通の日でも、\n\n自分にとって重要な意味を持つ\n\nなら significance が使えます。\n\n【significantとの関係】\n\n「ここは簡単です。」\n\nsignificant【形容詞】\n\nThis is a significant change.\n\n「これは重要な／大きな変化です。」\n\n📈 無視できないほど意味・影響がある変化\n\nsignificance【名詞】\n\nWe don't yet understand the significance of this change.\n\n「この変化の重要性・意味を、私たちはまだ理解していません。」\n\nつまり、\n\nsignificant\n→ 「意味・重要性がある」という性質\n\nsignificance\n→ その意味・重要性そのもの\n\nです。\n\n【類義語｜importanceとの違い】\n\n「先輩、ここが一番重要です。」\n\n単語\t核イメージ\nimportance\t⭐ 大事である度合い・重要性\nsignificance\t💡 そこにある意味・意義・重要性\nmeaning\t💬 言葉・出来事などが表す意味\nvalue\t💎 価値・有用性\nimpact\t💥 実際に与える影響\nimportance ⭐\n\nI understand the importance of exercise.\n\n「私は運動の重要性を理解しています。」\n\n→ 運動がどれだけ大切か\n\nsignificance 💡\n\nI understand the significance of this discovery.\n\n「私はこの発見の重要性・意義を理解しています。」\n\n→ この発見が何を意味し、なぜ重要なのか\n\nここ、違いが見えます？\n\nimportance\n→ ⭐ どれくらい大事？\n\nsignificance\n→ 💡 それにはどんな重要な意味がある？\n\nです。\n\n【crucialともつなげましょう】\n\n「さっきの単語も忘れないでくださいね。」\n\ncrucial ⚖️\n→ 結果を左右するほど重要\n\nsignificant 📈\n→ 無視できないほど意味・影響がある\n\nsignificance 💡\n→ その意味・重要性・意義そのもの\n\nたとえば、\n\nThis was a crucial decision.\n\n⚖️ この決断が結果を左右した\n\n一方、\n\nWe later understood the significance of the decision.\n\n💡 後になって、その決断がどれほど重要な意味を持っていたか分かった\n\nという違いがあります。\n\n【理解確認】\n\n「はい、3問です。」\n\nQ1\n\nsignificance は何詞？\n\n……\n\n名詞です。\n\nsignificant → 形容詞\nsignificance → 名詞\n\nQ2\n\nsignificance の核イメージは？\n\nA. 結果を左右する\nB. 見過ごせない意味・重要性がある\nC. 必須の構成要素\n\n……\n\nBです。💡\n\nQ3\n\nimportance と significance の違いは？\n\n……\n\nimportance ⭐\n→ どれだけ大事か\n\nsignificance 💡\n→ それが持つ意味・意義・重要性\n\n「はい。それが言えれば十分です。」\n\n【30秒復習】\n\n① significance\n→ 重要性・意義・意味\n\n② 発音\n→ シグニフィカンス\n\n③ 品詞\n→ 名詞\n\n④ significant\n→ 重要な・意味のある・無視できないほど大きな\n\n⑤ the significance of ～\n→ ～の重要性・意義\n\n⑥ historical significance\n→ 歴史的意義\n\n⑦ importanceとの違い\n→ ⭐ importance＝どれだけ大事か\n→ 💡 significance＝どんな重要な意味を持つか\n\n【一文で覚える】\n\nsignificance =「これ、ただの出来事じゃない。ちゃんと重要な意味がある」💡\n\n「先輩、これで significant → significance はセットです。」\n\nsignificant 📈\n→ 意味・影響が無視できない【形容詞】\n\n↓その性質を名詞にする\n\nsignificance 💡\n→ その重要性・意義・意味そのもの【名詞】\n\n「この変化を頭に入れておけば、英文で the significance of ～ が出てきても、もう『何だっけ？』とはならないはずですよ。」\n\n⚠️ 重複チェック：ordinary は、この「単語」プロジェクト内ですでに学習した単語です。\n以前、Common → Ordinary → Familiar の流れで扱っています。今回は復習として、違いまでしっかり固めましょう。"}, {"name": "matter", "text": "## matter /ˈmætər/\n**読み方：マター**\n\n「先輩、**matter** はかなり重要です。しかも、意味が多く見えるので混乱しやすい単語なんですよ。」\n\nでも中心イメージを一つ持てば大丈夫です。\n\n> 🎯 **matter =「無視できないもの・考える対象になるもの」**\n\nここから、名詞の**「事柄・問題」**と、動詞の**「重要である」**がつながります。\n\n# A【要点｜まず全体を掴みましょう】\n\n「まず、この2つを見てください。」\n\n> **It's a serious matter.**  \n> それは深刻な**問題・事柄**です。\n\nそして、\n\n> **It doesn't matter.**  \n> **それは重要ではないよ。／構わないよ。**\n\n「え？ 同じ **matter** なのに『問題』と『重要』？」\n\nはい。でもちゃんとつながっています。\n\n### 名詞 matter\n\n🎯 **考える対象となる事柄**\n\n→ 事柄・問題・案件\n\n### 動詞 matter\n\n🎯 **無視できないものとして意味を持つ**\n\n→ 重要である・問題になる\n\n「つまり両方とも、**『それを気にする必要があるか』**という感覚が中心にあるんです。」\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n## ① 動詞：matter「重要である」\n\n「まず日常会話でかなり重要なこちらから。」\n\n> **Money matters.**\n\nこれは、\n\n**「お金は重要だ。」**\n\nです。\n\n「先輩、ここで *matter* は名詞じゃありませんよ。」\n\n**matter = 動詞**\n\nです。\n\nつまり、\n\n**それによって結果が変わる**\n↓\n無視できない\n↓\n気にする価値がある\n↓\n🎯 **matter = 重要である**\n\nという感覚です。\n\n---\n\n## ② It doesn't matter.\n\n「これ、本当によく出ます。」\n\n> **It doesn't matter.**\n\n直訳すると、\n\n**「それは重要ではありません。」**\n\nでも会話では、\n\n**「別にいいよ。」**  \n**「構わないよ。」**  \n**「どっちでもいいよ。」**  \n**「問題ないよ。」**\n\nなどになります。\n\nたとえば、\n\n> **A: Sorry I'm a little late.**  \n> 少し遅れてごめん。\n\n> **B: It doesn't matter.**  \n> 構わないよ。\n\nつまり、\n\n**そのことは気にするほど重要じゃない**\n↓\n**気にしなくていい**\n↓\n**構わないよ**\n\nとなるんですね。\n\n---\n\n## ③ 名詞：matter「事柄・問題」\n\n> **We need to discuss this matter.**\n\n**「この件について話し合う必要があります。」**\n\n「ここでは、みんなが考えたり話し合ったりする**対象となる事柄**ですよね。」\n\nだから、\n\n> **this matter**\n\nは仕事なら、\n\n**この件・この問題・この案件**\n\nなどと訳せます。\n\n---\n\n# C【イメージ理解｜一回、想像してください】\n\n「先輩、明日の昼ご飯を決めるとします。」\n\n私が、\n\n「ラーメンとカレー、どっちがいいです？」\n\nと聞きました。\n\n先輩が、\n\n> **It doesn't matter.**\n\nと言ったら、\n\n🍜でも🍛でも\n\n**結果として大して困らない**\n↓\n**重要じゃない**\n↓\n**どっちでもいい**\n\nということです。\n\nでも私が、\n\n「じゃあ先輩の就職先、適当に私が決めておきますね。」\n\nって言ったら……\n\n「え、ダメ？」\n\n「……当然です。」\n\nこれは、\n\n> **It matters.**\n\nですよね。\n\n🏢 就職先が変わる  \n↓\n生活・仕事・将来が変わる  \n↓\n無視できない  \n↓\n🎯 **It matters.**\n\n「この**『気にする必要がある？』**という感覚、残してください。」\n\n---\n\n# D【具体例｜よく使うmatterをまとめます】\n\n### ① It doesn't matter.\n\n> **It doesn't matter to me.**\n\n**「私は気にしません。」  \n「私にとってはどちらでもいいです。」**\n\n非常に便利です。\n\n---\n\n### ② What matters is ～\n\nこれも重要ですよ。\n\n> **What matters is your effort.**\n\n**「大切なのはあなたの努力です。」**\n\n直感的には、\n\n> **What matters**  \n> → 重要であるもの  \n> → **大切なのは～**\n\nですね。\n\n---\n\n### ③ matter to 人\n\n> **You matter to me.**\n\n「先輩、これ良い表現なので覚えてください。」\n\n**「あなたは私にとって大切です。」**\n\n単なる、\n\n**You are important to me.**\n\nにかなり近いですが、**「あなたの存在には私にとって意味・価値がある」**という感じが出せます。\n\n---\n\n### ④ no matter ～\n\nこれも超重要です。\n\n> **No matter what happens, I'll keep trying.**\n\n**「何が起きても、私は挑戦し続けます。」**\n\n**no matter what**\n→ 何が～でも\n\nほかにも、\n\n**no matter who**\n→ 誰が～でも\n\n**no matter where**\n→ どこで～でも\n\n**no matter how**\n→ どんなに～でも\n\nがあります。\n\n---\n\n### ⑤ What's the matter?\n\n「これは *What's the problem?* に近い表現です。」\n\n> **What's the matter?**\n\n**「どうしたの？」  \n「何か問題でもあるの？」**\n\nたとえば先輩が急に黙り込んだら、\n\n> **What's the matter?**\n\nですね。\n\n「ただし毎回『問題は何ですか？』なんて機械的に訳さないでください。」\n\n日常会話なら自然に、\n\n**「どうしたの？」**\n\nで大丈夫です。\n\n---\n\n# 【類義語｜importantとの違い】\n\n「先輩、さっきまでの『重要シリーズ』とつなげましょう。」\n\n| 単語 | イメージ |\n|---|---|\n| **matter** | 🎯 無視できない・意味を持つ |\n| **important** | ⭐ 重要である |\n| **significant** | 📈 無視できない意味・影響がある |\n| **essential** | 🧩 成立に欠かせない |\n| **vital** | ❤️ 維持・生命に不可欠 |\n| **crucial** | ⚖️ 結果を左右する |\n\n### important ⭐\n\n> **This is important.**\n\n**「これは重要です。」**\n\n非常に一般的な「重要」。\n\n### matter 🎯\n\n> **This matters.**\n\n**「これは重要だ。」  \n「これはちゃんと意味がある。」**\n\n「重要」という**形容詞を付ける**のではなく、\n\n**その物事自体が重要性を持っている**\n\nという動詞です。\n\nだから、\n\n> **Every vote matters.**\n\nなら、\n\n**「一票一票が重要だ。」**\n\nつまり、\n\n**一票だって無意味じゃない。ちゃんと結果に意味を持つ。**\n\nという感覚が出ます。\n\n---\n\n# 【significanceともつなげましょう】\n\n「さっきの単語、もう忘れてないですよね？」\n\n**significance 💡**\n→ 物事が持つ**重要な意味・意義**\n\n**matter 🎯**\n→ **重要である・意味を持つ**\n\nたとえば、\n\n> **This decision matters.**\n\n🎯 この決定は**重要だ**。\n\n一方、\n\n> **We need to understand the significance of this decision.**\n\n💡 この決定が持つ**意味・重要性を理解する必要がある**。\n\n「品詞も違いますね。」\n\n**matter → 動詞として使える**  \n**significance → 名詞**\n\nです。\n\n---\n\n# 【もう一つの意味：物質】\n\n「先輩、これもあります。」\n\n> **matter = 物質**\n\nたとえば、\n\n> **Matter can exist as a solid, liquid, or gas.**\n\n**「物質は固体・液体・気体として存在できます。」**\n\nここでは、\n\n🪨固体  \n💧液体  \n💨気体\n\nなどの**物理的な物質**の意味です。\n\n「日常会話の *It doesn't matter.* とは意味が違うので、文脈で判断してください。」\n\n---\n\n# 【理解確認】\n\n「はい先輩。3問だけです。」\n\n### Q1\n\n> **It doesn't matter.**\n\nは？\n\nA. 物質ではない  \nB. 構わない・重要ではない  \nC. 深刻な問題だ\n\n……\n\n**Bです。🎯**\n\n---\n\n### Q2\n\n> **You matter to me.**\n\nは？\n\n……\n\n**「あなたは私にとって大切です。」**\n\n「存在に意味・価値がある」という感覚ですね。\n\n---\n\n### Q3\n\n> **What matters is what you do next.**\n\nこれは？\n\n……\n\n**「大切なのは、あなたが次に何をするかです。」**\n\n**What matters = 大切なのは～**\n\nここ、かなり使えますよ。\n\n---\n\n# 【30秒復習】\n\n① **matter【名詞】**  \n→ 事柄・問題・案件\n\n② **matter【動詞】**  \n→ 🎯 重要である・意味を持つ\n\n③ **It doesn't matter.**  \n→ 構わない・気にしない・重要ではない\n\n④ **What's the matter?**  \n→ どうしたの？\n\n⑤ **What matters is ～**  \n→ 大切なのは～だ\n\n⑥ **You matter to me.**  \n→ あなたは私にとって大切だ\n\n⑦ **no matter what**  \n→ 何が～でも\n\n⑧ **matter【物理】**  \n→ 物質\n\n# 【一文で覚える】\n\n> **matter =「それって、気にするだけの意味・重要性がある？」🎯**\n\n「先輩、特に今日は **It doesn't matter.** だけで終わらず、**matter =『重要性・意味を持つ』という動詞**まで覚えてください。」\n\n**What matters is ～**  \n**It matters.**  \n**You matter to me.**\n\n「この3つが自然に分かるようになれば、matter の感覚はかなり掴めていますよ。」"}, {"name": "trivial", "text": "先輩、まずスペルだけ直しますね。\n\n**❌ trival → ✅ trivial**\n\nそれと重複チェックですが、**trivial は以前このプロジェクト内で、essential / crucial の「反対語」としてすでに登場しています。** ただし、今回のように **trivial 自体をメイン単語として詳しく学習するのは別扱い**にできます。\n\n## trivial /ˈtrɪviəl/\n**読み方：トリヴィアル**\n\n「先輩、**trivial** は『小さい』だけじゃないんです。」\n\n> 🪶 **trivial =「重要性が低く、気にするほどではない」**\n\nこの感覚が中心です。\n\n# A【要点｜まず全体を掴みましょう】\n\n「たとえば会社で問題が2つ起きました。」\n\n**問題A**  \n→ 会社の重要データが全部消えた\n\n**問題B**  \n→ コピー用紙が1枚曲がっていた\n\n「……同じ『問題』でも重要度が全然違いますよね？」\n\n問題Bのような、\n\n> **小さくて、重要性がほとんどないこと**\n\nが **trivial** です。\n\n> **a trivial problem**  \n> ささいな問題\n\nつまり、\n\n**問題・違いなどがある**\n↓  \nでも影響が小さい\n↓  \n重要ではない\n↓  \n🪶 **trivial**\n\nです。\n\n---\n\n# B【詳しい解説｜なぜ「ささいな」になるの？】\n\nたとえば、\n\n> **Don't worry about such trivial matters.**\n\n**「そんなささいなことで悩まないで。」**\n\nここで **trivial matter** は、\n\n「問題ではあるけれど、そこまで重要ではないもの」\n\nです。\n\n「先輩、さっき **matter** をやりましたよね？」\n\n**matter 🎯**\n→ 事柄・問題\n\nそこに **trivial 🪶** がつくと、\n\n> **trivial matter**  \n> → **重要性の低い事柄**  \n> → **ささいなこと**\n\nとなります。\n\nだから、\n\n> **It's a trivial matter.**\n\nなら、\n\n**「それはささいなことです。」**\n\nです。\n\n---\n\n# C【イメージ理解｜想像してください】\n\n「先輩、明日大事な面接があるとします。」\n\nところが前日の夜、\n\n「シャーペンの芯が一本折れた……。」\n\nって30分悩んでいる。\n\n「……先輩？」\n\n明日の面接の準備と比べたら、その一本の芯は？\n\n**重要度がかなり低いですよね。**\n\n⚖️\n\n**面接準備** ██████████\n\n**芯一本**　▏\n\nこの、\n\n> 🪶 **「そんなに重要視するほどのことじゃない」**\n\nが **trivial** です。\n\n---\n\n# D【具体例｜英文で確認します】\n\n### ① trivial problem\n\n> **It's just a trivial problem.**\n\n**「それはほんのささいな問題です。」**\n\n**just** が入ることで、\n\n「そんな大した問題じゃないよ」\n\nという感じがさらに出ています。\n\n---\n\n### ② trivial difference\n\n> **The difference is trivial.**\n\n**「その違いはささいなものです。」**\n\n違いは存在します。\n\nでも、\n\n**結果に大きな影響を与えるほどではない**\n\nということですね。\n\n---\n\n### ③ trivial details\n\n> **Don't focus on trivial details.**\n\n**「ささいな細部にこだわらないでください。」**\n\n「これ、先輩には覚えておいてほしい表現ですね。」\n\n細かい部分ばかり見る  \n↓  \n重要な全体像を見失う\n\nだから、\n\n> **trivial details**\n\n＝ **重要性の低い細部**\n\nです。\n\n---\n\n# 【類義語｜minor・insignificantとの違い】\n\n「ここ、ちゃんと分けますよ。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **trivial** | 🪶 気にするほど重要ではない |\n| **minor** | 🤏 規模・程度が小さい |\n| **insignificant** | 🌫️ 重要性・影響がほとんどない |\n| **petty** | 😒 くだらないほど細かい |\n| **unimportant** | ◻️ 単純に重要ではない |\n\n### minor 🤏\n\n> **a minor injury**\n\n**「軽いけが」**\n\nこれは**程度が小さい**ことに注目しています。\n\n### trivial 🪶\n\n> **a trivial issue**\n\n**「ささいな問題」**\n\nこちらは、\n\n**「重要視するほどじゃない」**\n\nという**重要度の低さ**がポイントです。\n\n---\n\n### insignificant 🌫️\n\n> **The difference is insignificant.**\n\n**「その差は重要ではない／取るに足りない。」**\n\n**significant 📈**\n→ 無視できない意味・影響がある\n\nその反対が、\n\n**insignificant 🌫️**\n→ 無視できる程度\n\nです。\n\n---\n\n### petty 😒\n\n> **They argued over a petty issue.**\n\n**「彼らはくだらないことで言い争った。」**\n\nこれは **trivial** より、\n\n> 「そんなことで争うの？」\n\nという**否定的・軽蔑的なニュアンス**が強くなります。\n\n---\n\n# 【crucialとの対比】\n\n「先輩、ここは綺麗に対比できます。」\n\n**crucial ⚖️**  \n→ 結果を左右するほど重要\n\n↕️\n\n**trivial 🪶**  \n→ 結果に大して影響しないほどささい\n\nたとえば、\n\n> **This is not a trivial issue. It's crucial.**\n\n**「これはささいな問題ではありません。極めて重要です。」**\n\n「この対比、かなり覚えやすいでしょう？」\n\n---\n\n# 【significantとの対比】\n\nこれもつながります。\n\n**significant 📈**  \n→ 無視できない意味・影響がある\n\n**trivial 🪶**  \n→ 気にするほどの重要性がない\n\nつまり、\n\n📈 **significant**  \n「これは無視できない。」\n\n🪶 **trivial**  \n「これはそこまで気にしなくていい。」\n\nという対比です。\n\n---\n\n# 【理解確認】\n\n「先輩、3問ですよ。」\n\n### Q1\n\n**trivial の核イメージは？**\n\nA. 結果を左右する  \nB. 気にするほど重要ではない  \nC. 成立に欠かせない\n\n……\n\n**Bです。🪶**\n\n### Q2\n\n**minor と trivial の違いは？**\n\n……\n\n**minor 🤏**\n→ 規模・程度が小さい\n\n**trivial 🪶**\n→ **重要性が低い**\n\nです。\n\n### Q3\n\n**crucial と trivial** を対比すると？\n\n……\n\n**crucial ⚖️**\n→ 結果を左右するほど重要\n\n**trivial 🪶**\n→ **結果に大して影響しないほどささい**\n\n「はい。これで大丈夫です。」\n\n---\n\n# 【30秒復習】\n\n① **trivial**  \n→ ささいな・取るに足らない\n\n② 発音  \n→ **トリヴィアル**\n\n③ 核イメージ  \n→ 🪶 **気にするほど重要ではない**\n\n④ **trivial matter**  \n→ ささいなこと\n\n⑤ **trivial problem**  \n→ ささいな問題\n\n⑥ **minorとの違い**  \n→ minor 🤏＝**程度が小さい**  \n→ trivial 🪶＝**重要性が低い**\n\n⑦ **crucialとの対比**  \n→ crucial ⚖️＝**結果を左右する**  \n→ trivial 🪶＝**大して影響しない**\n\n# 【一文で覚える】\n\n> **trivial =「確かに問題ではある。でも、そこまで気にするほど重要じゃない」🪶**\n\n「そしてスペルですよ、先輩。」\n\n❌ **trival**  \n✅ **trivial**\n\n**tri-vi-al → trivial**\n\nここ、次に書くときはちゃんと **i** を入れてくださいね。"}, {"name": "ordinary", "text": "ordinary /ˈɔːrdəneri/\n\n読み方：オーディナリー\n\n「先輩、ordinary = 普通のだけで覚えると、common / usual / normal / typical が全部『普通』になってしまいます。」\n\nordinary の核イメージは――\n\n👕 「特別でも珍しくもない、ごく普通の」\n\nです。\n\nA【要点｜まず全体を掴みましょう】\n\n「先輩、ホテルを想像してください。」\n\n一泊30万円のスイートルーム✨\nではなく、\n\n🛏️ ベッド\n🚿 シャワー\n📺 テレビ\n\nという普通の部屋。\n\nan ordinary hotel room\n\nなら、\n\n「ごく普通のホテルの部屋」\n\nです。\n\nつまり、\n\n特別？ → ❌\n珍しい？ → ❌\n際立っている？ → ❌\n\n特別なところがない\n↓\n👕 ordinary\n\nです。\n\nB【詳しい解説｜なぜそうなるの？】\n\nたとえば、\n\nHe looks like an ordinary person.\n\n「彼は普通の人に見えます。」\n\nこれは、\n\n「正常な人」という意味ではありません。\n\nその人を見ても、\n\n👑 王族っぽい\n⭐ 有名人っぽい\n🦸 特殊な能力がありそう\n\nという特別さがない。\n\nだから、\n\nordinary person\n→ ごく普通の人\n\nなんです。\n\n「ここで normal と混ぜないでくださいね。」\n\nordinary\n→ 特別ではない\n\nnormal\n→ 異常ではない・標準の範囲\n\nです。\n\nこの違い、後でもう一度やります。\n\nC【イメージ理解｜一回、想像してください】\n\n「先輩がレストランに入ったとします。」\n\n普通のカレー。\n\n🍛 900円\n\nそして隣には、\n\n✨最高級和牛\n✨金箔\n✨高級トリュフ\n\n🍛 30,000円\n\nのスペシャルカレー。\n\n「どっちが ordinary です？」\n\n……\n\n「はい。900円の普通のカレーですね。」\n\n🍛 ordinary\n→ 特別なものではない\n\n✨ special\n→ 普通とは違う特別なもの\n\nつまり、\n\n👕 ordinary ↔ special ⭐\n\nこの対比で覚えるとかなり分かりやすいです。\n\nD【具体例｜実際の英文で確認しましょう】\n① ordinary people\n\nThe new law will affect ordinary people.\n\n「その新しい法律は一般の人々にも影響します。」\n\nここでは、\n\n政治家や大企業の経営者などではなく、\n\n👨👩 普通に生活している一般の人々\n\nというニュアンスです。\n\n② ordinary day\n\nIt was just an ordinary day.\n\n「ごく普通の日でした。」\n\n誕生日でもない。\n\n大事件もない。\n\n宝くじも当たってない。\n\n「……まあ、普通ですね。」\n\n→ ordinary day\n\nです。\n\n③ nothing out of the ordinary\n\n「これ、面白い表現なので覚えてください。」\n\nThere was nothing out of the ordinary.\n\n「特に変わったことはありませんでした。」\n\nout of the ordinary\n\nは、\n\n普通の範囲\n↓\nそこから外に出る\n↓\n普通ではない・珍しい\n\nということ。\n\nだから、\n\nnothing out of the ordinary\n\n→ 普通から外れたものは何もない\n→ 特に変わったことはない\n\nです。\n\n【類義語｜「普通」シリーズを整理します】\n\n「はい先輩。ここが本番です。」\n\n単語\t核イメージ\nordinary\t👕 特別ではない、ごく普通\ncommon\t👥 多く見られる・よくある\nusual\t🔁 いつもそうである\nnormal\t📏 標準・正常の範囲\ntypical\t🏷️ その種類らしい特徴を持つ\ngeneral\t🌏 個別ではなく全体・一般\nordinary 👕\n\nHe's an ordinary guy.\n\n「彼はごく普通の人です。」\n\n→ 特別な人ではない\n\ncommon 👥\n\nThis is a common mistake.\n\n「これはよくある間違いです。」\n\n→ 多くの人がする\n\nここ重要ですよ。\n\nordinary mistake と common mistake は同じではありません。\n\ncommon\n→ 👥 たくさん見かける\n\nordinary\n→ 👕 特別ではない\n\nです。\n\nusual 🔁\n\nI took my usual train.\n\n「いつもの電車に乗りました。」\n\n→ 普段から繰り返している\n\nつまり、\n\nordinary 👕\n→ 特別じゃない\n\nusual 🔁\n→ いつも通り\n\nnormal 📏\n\nHis temperature is normal.\n\n「彼の体温は正常です。」\n\n→ 標準的な範囲に入っている\n\nだから、\n\nnormal temperature\n\nは自然ですが、\n\nordinary temperature\n\nとはニュアンスが違います。\n\nnormal 📏\n→ 正常範囲か？\n\nordinary 👕\n→ 特別か？\n\nです。\n\ntypical 🏷️\n\nThis is typical behavior for him.\n\n「これは彼にありがちな行動です。」\n\nこれは、\n\n「彼らしさが出ている」\n\nという感覚。\n\nordinary\n→ 特別ではない\n\ntypical\n→ その人・種類の特徴をよく表している\n\nですね。\n\n【反対方向も覚えましょう】\n\nordinary 👕\n→ ごく普通\n\n↕\n\nspecial ⭐\n→ 特別\n\nextraordinary ✨\n→ 並外れた・非凡な\n\n「特に extraordinary は形から覚えやすいですよ。」\n\nextra + ordinary\n\n→ ordinary を超えている\n→ 普通じゃない\n→ 並外れた\n\nShe has extraordinary talent.\n\n「彼女には並外れた才能があります。」\n\n【理解確認】\n\n「先輩、復習単語だからこそ3問いきますよ。」\n\nQ1\n\nordinary の核イメージは？\n\nA. 多く見られる\nB. 特別でも珍しくもない\nC. いつも繰り返す\n\n……\n\nBです。👕\n\nQ2\n\nordinary と common の違いは？\n\n……\n\nordinary 👕\n→ 特別ではない\n\ncommon 👥\n→ 多く見られる・よくある\n\nです。\n\nQ3\n\nordinary と normal は？\n\n……\n\nordinary 👕\n→ 特別かどうか\n\nnormal 📏\n→ 正常・標準の範囲かどうか\n\n「はい。ここまで区別できれば、前回より一段深くなってます。」\n\n【30秒復習】\n\n① ordinary\n→ 普通の・平凡な\n\n② 発音\n→ オーディナリー\n\n③ 核イメージ\n→ 👕 特別ではない、ごく普通\n\n④ ordinary people\n→ 一般の人々\n\n⑤ ordinary day\n→ ごく普通の日\n\n⑥ out of the ordinary\n→ 普通ではない・珍しい\n\n⑦ commonとの違い\n→ ordinary 👕＝特別じゃない\n→ common 👥＝よくある\n\n⑧ normalとの違い\n→ ordinary 👕＝特別じゃない\n→ normal 📏＝正常範囲\n\n【一文で覚える】\n\nordinary =「すごくも珍しくもない。ごく普通」👕\n\n「先輩、今回は重複単語でした。でも、こういう重複は悪くありません。」\n\nordinary 👕 特別じゃない\ncommon 👥 よくある\nusual 🔁 いつも通り\nnormal 📏 正常範囲\ntypical 🏷️ その種類らしい\n\n「この5つを全部『普通』にしない。ここまで分けられれば、復習した意味はちゃんとありますよ。」\n\n⚠️ 重複チェック：neglect は、この「単語」プロジェクト内ですでに学習済みです。\n以前 Emphasize → Neglect の流れで扱っています。今回は ignore / overlook / abandon との違いまで含めて復習しましょう。"}, {"name": "emphasize", "text": "⚠️ **重複チェック：emphasize は、この「単語」プロジェクト内ですでに学習しています。**  \n以前の英単語学習で **Emphasize → Neglect** の流れで扱っています。今回は復習として、**stress / highlight / underscore** との違いまで固めますね。\n\n## emphasize /ˈemfəsaɪz/\n**読み方：エンファサイズ**\n\n「先輩、**emphasize = 強調する**で覚えているなら、意味は合っています。」\n\n「でも『強調するって具体的に何してるの？』までイメージできます？」\n\n> 🔦 **emphasize =「ここが大事だから、特に意識を向けて！」**\n\nこれが核です。\n\n# A【要点｜まず全体を掴みましょう】\n\n「文章に10個の情報があるとします。」\n\n① ② ③ ④ ⑤ **⑥** ⑦ ⑧ ⑨ ⑩\n\n全部同じ重要度ではありません。\n\nそこで、\n\n> **特に⑥が重要です！**\n\nと注意を向ける。\n\n① ② ③ ④ ⑤  \n　　　🔦  \n　　**⑥！！**  \n⑦ ⑧ ⑨ ⑩\n\nこれが **emphasize** です。\n\n> **The teacher emphasized the importance of practice.**  \n> 先生は練習の重要性を**強調しました**。\n\nつまり、\n\n**重要なポイントがある**  \n↓  \n相手にそこを特に意識してほしい  \n↓  \n言葉・話し方などで目立たせる  \n↓  \n🔦 **emphasize**\n\nです。\n\n---\n\n# B【詳しい解説｜なぜそうなるの？】\n\n「たとえば私が先輩にこう言ったとします。」\n\n> 「毎日英語を勉強してください。」\n\nこれでも意味は伝わります。\n\nでも、\n\n> 「先輩、**毎日**ですよ。週末にまとめて、じゃありません。**毎日続けること**が大事なんです。」\n\n「……どうです？」\n\n**毎日続ける**\n\nという部分に注意が向きましたよね。\n\nこれが **emphasize**。\n\n> **I want to emphasize the importance of consistency.**\n\n**「継続することの重要性を強調したいです。」**\n\nつまり、情報を新しく追加することより、\n\n> 🔦 **すでにある情報の中で『ここ重要！』と目立たせる**\n\n感覚なんです。\n\n---\n\n# C【イメージ理解｜蛍光ペンです】\n\n「先輩、教科書を読んでいるところを想像してください。」\n\n文章が20行あります。\n\n全部真っ黒。\n\nでも試験に出るところだけ、\n\n🟨🟨🟨  \n**ここ重要**  \n🟨🟨🟨\n\nと蛍光ペンを引く。\n\n「目がそこに行きますよね？」\n\nこれが **emphasize** の感覚です。\n\n> 普通の情報  \n> 普通の情報  \n> 🔦 **重要な情報！！**  \n> 普通の情報\n\nつまり、\n\n**情報の重要度を目立たせて、相手の注意をそこへ向ける**\n\nんです。\n\n---\n\n# D【具体例｜実際の英文で確認しましょう】\n\n### ① emphasize the importance of ～\n\nこれはかなり重要な組み合わせです。\n\n> **The doctor emphasized the importance of regular exercise.**\n\n**「医師は定期的な運動の重要性を強調しました。」**\n\n**emphasize the importance of ～**  \n→ **～の重要性を強調する**\n\n丸ごと覚えて大丈夫です。\n\n---\n\n### ② emphasize that ～\n\n> **She emphasized that safety comes first.**\n\n**「彼女は安全が第一だと強調しました。」**\n\n「安全について話した」だけではありません。\n\n🔦 **特にそこを重要ポイントとして伝えた**\n\nんですね。\n\n---\n\n### ③ emphasize a point\n\n> **He emphasized this point several times.**\n\n**「彼はこの点を何度も強調しました。」**\n\n同じポイントを繰り返すことで、\n\n「ここ、本当に重要ですよ」\n\nと注意を向けています。\n\n---\n\n# 【類義語｜ここが大事です】\n\n「先輩、英語には『強調する』がいくつもあります。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **emphasize** | 🔦 重要性を際立たせる |\n| **stress** | ❗ 強く念押しする |\n| **highlight** | 🖍️ 注目ポイントとして目立たせる |\n| **underscore** | ＿ 重要性を改めて明確にする |\n| **point out** | 👉 相手が気づくよう指摘する |\n\n### emphasize 🔦\n\n> **She emphasized the importance of teamwork.**\n\n**「彼女はチームワークの重要性を強調した。」**\n\n→ **重要だから特に意識してほしい**\n\n最も基本として覚えましょう。\n\n---\n\n### stress ❗\n\n> **The teacher stressed the importance of preparation.**\n\n**「先生は準備の重要性を強く強調した。」**\n\nemphasize とかなり近いです。\n\nただ **stress** は、\n\n> ❗「ここ、本当に大事だからね。」\n\nという**強い念押し**をイメージすると分かりやすいです。\n\n---\n\n### highlight 🖍️\n\n> **The report highlights several problems.**\n\n**「その報告書はいくつかの問題点を浮き彫りにしている。」**\n\n蛍光ペンで、\n\n🖍️ **ここを見て！**\n\nと目立たせる感じ。\n\n報告書・プレゼンなどでもよく使われます。\n\n---\n\n### point out 👉\n\n> **She pointed out a mistake in my report.**\n\n**「彼女は私の報告書の間違いを指摘した。」**\n\nこれは「重要性を強調」というより、\n\n👉 **相手が気づいていないものを指し示す**\n\n感じです。\n\nだから、\n\n**emphasize 🔦**\n→ 「ここは重要！」\n\n**point out 👉**\n→ 「ほら、ここにありますよ。」\n\nと考えるといいですね。\n\n---\n\n# 【neglectとの対比】\n\n「先輩、以前 **emphasize → neglect** と続けて学習したので、ここもつなげておきましょう。」\n\n**emphasize 🔦**  \n→ 重要だとして**注意を向ける**\n\n↕\n\n**neglect 🙈**  \n→ 必要なのに**注意を向けない・放置する**\n\nたとえば、\n\n> **We should emphasize safety, not neglect it.**\n\n**「安全を軽視・放置するのではなく、その重要性を強調すべきです。」**\n\n方向がほぼ逆ですね。\n\n---\n\n# 【理解確認】\n\n「はい先輩。復習だから3問、ちゃんと答えてください。」\n\n### Q1\n\nemphasize の核イメージは？\n\nA. 情報を削除する  \nB. 重要なところに特に注意を向ける  \nC. 間違いを発見する\n\n……\n\n**Bです。🔦**\n\n### Q2\n\n**emphasize と point out** の違いは？\n\n……\n\n**emphasize 🔦**  \n→ **重要性を際立たせる**\n\n**point out 👉**  \n→ **相手が気づくよう指摘する**\n\nです。\n\n### Q3\n\n> **I want to emphasize the importance of sleep.**\n\nは？\n\n……\n\n**「睡眠の重要性を強調したいです。」**\n\nはい。完璧です。\n\n---\n\n# 【30秒復習】\n\n① **emphasize**  \n→ 強調する\n\n② 発音  \n→ **エンファサイズ**\n\n③ 核イメージ  \n→ 🔦 **「ここ重要！」と注意を向ける**\n\n④ **emphasize the importance of ～**  \n→ ～の重要性を強調する\n\n⑤ **emphasize that ～**  \n→ ～ということを強調する\n\n⑥ **stress ❗**  \n→ 強く念押しする\n\n⑦ **highlight 🖍️**  \n→ 注目ポイントとして目立たせる\n\n⑧ **point out 👉**  \n→ 気づかせるために指摘する\n\n# 【一文で覚える】\n\n> **emphasize =「そこ、流さないでください。特に大事なのは“ここ”です」🔦**\n\n「そして先輩、今回は**重複単語**です。」\n\nこういう場合は今後も、最初に **⚠️ 過去に学習済み** と知らせたうえで、前回より類義語の違いまで深く復習できる形にします。"}, {"name": "underline", "text": "## underline /ˌʌndərˈlaɪn/\n**読み方：アンダーライン**\n\n「先輩、**underline** は簡単そうに見えますけど、さっきの **emphasize** とつなげるとかなり覚えやすいですよ。」\n\n> 〰️ **underline =「下線を引く → そこが重要だとはっきり示す」**\n\nつまり、**本当に線を引く意味**と、**比喩的に強調する意味**の2つがあります。\n\n# A【要点｜まず全体を掴みましょう】\n\n「まず単語を分解してみてください。」\n\n**under**\n→ 下に\n\n**line**\n→ 線\n\nだから、\n\n> **underline**\n> → **下に線を引く**\n\nこれはそのままですね。\n\nたとえば、\n\n> **Underline the correct answer.**\n\n**「正しい答えに下線を引いてください。」**\n\nA. apple  \nB. **banana**  \n　￣￣￣￣  \nC. orange\n\n「ここまでは簡単です。」\n\nでも、重要なのはここから。\n\nなぜ人は文章に下線を引きます？\n\n……\n\n「そうです。**重要だから目立たせるため**ですよね。」\n\nそこから、\n\n> 〰️ **underline = 強調する・明確に示す**\n\nという比喩的な意味が生まれます。\n\n---\n\n# B【詳しい解説｜emphasizeとの関係】\n\nたとえば政府の報告書に、\n\n> **The report underlines the importance of education.**\n\nと書いてあったとします。\n\nこれは、\n\n❌「報告書が教育の重要性に物理的な下線を引いた」\n\nという意味ではありません。\n\n「……報告書に手はありませんからね。」\n\n意味は、\n\n> **「その報告書は教育の重要性を強調している。」**\n\nです。\n\n頭の中では、\n\n**education is important**\n\n　　　↓↓↓\n\n**EDUCATION IS IMPORTANT**  \n￣￣￣￣￣￣￣￣￣￣￣￣\n\nこんな感じ。\n\nつまり、\n\n何か重要なことがある  \n↓  \nそこに下線を引くように目立たせる  \n↓  \n「ここを見て」と重要性を明確にする  \n↓  \n〰️ **underline = 強調する**\n\nとなります。\n\n---\n\n# C【イメージ理解｜先輩のノートです】\n\n「先輩が試験勉強しているとしましょう。」\n\n教科書に、\n\n> 金利が上昇すると、企業の借入コストが増加する。\n\nと書いてあります。\n\n「ここ試験に出そうだな」と思って、\n\n> **金利が上昇すると、企業の借入コストが増加する。**  \n> ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣\n\nと線を引く。\n\nすると後から見たとき、\n\n👀「あ、ここ重要なんだ。」\n\nって分かりますよね。\n\nこの、\n\n> 〰️ **下線を引いて重要ポイントを浮かび上がらせる**\n\n感覚が、そのまま比喩的な **underline** になっています。\n\n---\n\n# D【具体例｜2つの意味を分けます】\n\n### ① 本当に「下線を引く」\n\n> **Underline the key words.**\n\n**「重要な単語に下線を引いてください。」**\n\nこれは物理的な下線です。\n\n**under + line**\n→ 下に線\n\nそのままですね。\n\n---\n\n### ②「強調する」\n\n> **The results underline the importance of regular exercise.**\n\n**「その結果は、定期的な運動の重要性を強調しています。」**\n\n結果そのものが、\n\n> 「ほら、運動って重要でしょう？」\n\nと**重要性をはっきり示している**わけです。\n\n---\n\n### ③ underline the need for ～\n\nこれも使いやすい表現です。\n\n> **The accident underlined the need for better safety measures.**\n\n**「その事故は、より良い安全対策の必要性を浮き彫りにしました。」**\n\n事故が起きた  \n↓  \n今の安全対策では不十分だと分かった  \n↓  \n「もっと安全対策が必要だ」と明確になった  \n↓  \n〰️ **underline**\n\nです。\n\n---\n\n# 【類義語｜emphasize・highlight・underscore】\n\n「先輩、ここですよ。さっきの **emphasize** と比較しましょう。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **emphasize** | 🔦 重要性を強調する |\n| **underline** | 〰️ 下線を引くように重要性を明確にする |\n| **highlight** | 🖍️ 目立たせて注目させる |\n| **underscore** | ＿ 下線を引くように強く強調する |\n| **stress** | ❗ 強く念押しする |\n\n### emphasize 🔦\n\n> **She emphasized the importance of teamwork.**\n\n「彼女はチームワークの重要性を強調した。」\n\n→ **重要だから、そこに注意を向ける**\n\nかなり一般的な「強調する」です。\n\n---\n\n### underline 〰️\n\n> **The study underlines the importance of sleep.**\n\n**「その研究は睡眠の重要性を強調している。」**\n\n→ 研究結果によって、重要性が**はっきり示される**\n\n頭の中では、\n\n**SLEEP IS IMPORTANT**  \n￣￣￣￣￣￣￣￣￣￣\n\nですね。\n\n---\n\n### highlight 🖍️\n\n> **The report highlights several problems.**\n\n**「その報告書はいくつかの問題を浮き彫りにしている。」**\n\n→ 🖍️ **目立つようにして注目させる**\n\n---\n\n### underscore ＿\n\n「これ、**underline とかなり近い**です。」\n\n> **The incident underscores the need for change.**\n\n**「その出来事は変革の必要性を強く示している。」**\n\n**underscore** も元々「下線」というイメージを持ち、動詞では**強調する**という意味でよく使われます。\n\n---\n\n# 【emphasizeとの違いを一言で】\n\n「ここだけ残してください。」\n\n**emphasize 🔦**\n→ **『ここ重要ですよ』と重点を置く**\n\n**underline 〰️**\n→ **『ほら、これが重要だと分かりますよね』と明確にする**\n\nただし、実際には意味がかなり重なり、文脈によってどちらも「強調する」と訳せます。\n\n---\n\n# 【理解確認】\n\n「はい、3問です。」\n\n### Q1\n\nunderline の元々の意味は？\n\n……\n\n**「下線を引く」〰️**\n\nです。\n\n### Q2\n\n> **The report underlines the importance of education.**\n\nこれは？\n\n……\n\n**「その報告書は教育の重要性を強調している。」**\n\nですね。\n\n### Q3\n\n**underline と highlight** のイメージの違いは？\n\n……\n\n**underline 〰️**\n→ 下線を引くように**重要性を明確にする**\n\n**highlight 🖍️**\n→ 蛍光ペンで塗るように**目立たせて注目させる**\n\n「はい。それで十分です。」\n\n# 【30秒復習】\n\n① **underline**  \n→ 下線を引く／強調する\n\n② 発音  \n→ **アンダーライン**\n\n③ 元のイメージ  \n→ **under + line = 下に線**\n\n④ 比喩的なイメージ  \n→ 〰️ **重要なところに下線を引くように強調**\n\n⑤ **underline the importance of ～**  \n→ ～の重要性を強調する\n\n⑥ **underline the need for ～**  \n→ ～の必要性を強調する・浮き彫りにする\n\n⑦ **emphasizeとの関係**  \n→ emphasize 🔦＝重要性に重点を置く  \n→ underline 〰️＝重要性を明確に示す\n\n# 【一文で覚える】\n\n> **underline =「ここ重要です。下線を引いておきますね」〰️**\n\n「先輩、さっきの **emphasize** と一緒に覚えるといいですよ。」\n\n**emphasize 🔦 → ここを重要視して！**  \n**highlight 🖍️ → ここを目立たせる！**  \n**underline 〰️ → ここが重要だとはっきり示す！**  \n**stress ❗ → ここ本当に大事だから！**\n\n「全部『強調する』ですけど、頭の中の動作が違うんです。そこまで映像で分けられれば、かなり忘れにくくなりますよ。」"}, {"name": "neglect", "text": "neglect /nɪˈɡlekt/\n\n読み方：ニグレクト\n\n「先輩、neglect = 無視するだけで覚えていたら、少し修正が必要です。」\n\n🌱💀 neglect =「本来やるべき世話・注意・責任を怠って、放っておく」\n\nここが ignore との大きな違いです。\n\nA【要点｜まず全体を掴みましょう】\n\n「先輩が植物を育てているとします。」\n\n🌱 水をあげる\n🌱 日光に当てる\n🌱 状態を確認する\n\nこれは、本来やるべき世話ですよね。\n\nでも、\n\n「まあ明日でいいか。」\n\n翌日も、\n\n「明日で……。」\n\nそして何週間も放置。\n\n🌱\n↓\n🥀\n↓\n💀\n\n「……これは単に植物を『無視した』だけじゃありません。」\n\n世話をする責任がある\n↓\nでも必要なことをしない\n↓\n放置する\n↓\n悪い状態になる\n\nこれが neglect です。\n\nB【詳しい解説｜なぜそうなるの？】\n\nたとえば、\n\nHe neglected his health.\n\n「彼は自分の健康管理を怠った。」\n\nとします。\n\n「健康を見ないようにした」という単純な話ではありません。\n\n本来なら、\n\n睡眠を取る\n↓\n食生活に気をつける\n↓\n必要なら病院へ行く\n\nなど、健康を維持するためにするべきことがあります。\n\nでも、それをしない。\n\n必要な注意・行動がある\n↓\nそれを怠る\n↓\n放置状態になる\n↓\n🌱 neglect\n\nなんです。\n\nだから日本語では文脈によって、\n\n怠る / 放置する / おろそかにする / 世話をしない\n\nなどになります。\n\nC【イメージ理解｜仕事で考えましょう】\n\n「先輩に毎月確認しなければならない資料があるとします。」\n\n📄「確認してください」\n\n先輩\n「あとでやります。」\n\n翌日。\n\n📄「……確認は？」\n\n「あとで。」\n\n一週間後。\n\n📄「先輩？」\n\n「……。」\n\n「もう。完全に neglect してるじゃないですか。」\n\nつまり、\n\n知らなかった\nではありません。\n\nやるべきことがあるのに、十分な注意を払わず放置した\n\nというのがポイントです。\n\nneglect one's duties\n\nなら、\n\n「自分の職務を怠る」\n\nとなります。\n\nD【具体例｜よく使う形を覚えます】\n① neglect one's health\n\nDon't neglect your health.\n\n「健康をおろそかにしないでください。」\n\n健康管理という本来注意を払うべきものを放置しない、ということですね。\n\n② neglect one's duties\n\nHe was criticized for neglecting his duties.\n\n「彼は職務を怠ったことで批判されました。」\n\n仕事上の責任がある\n↓\n必要な仕事をしない\n↓\nneglect one's duties\n\nです。\n\n③ neglect to do\n\n「これも重要ですよ。」\n\nHe neglected to lock the door.\n\n「彼はドアに鍵をかけるのを怠った。」\n\nneglect to + 動詞\n→ ～するのを怠る\n\nです。\n\n単純に「忘れた」とは限りません。\n\nすべきことをしなかったことに焦点があります。\n\n④ 名詞の neglect\n\nneglect は名詞にもなります。\n\nThe building fell into neglect.\n\n「その建物は手入れされず放置状態になった。」\n\nまた、\n\nchild neglect\n\nなら、子どもに必要な養育・世話を与えない**ネグレクト（養育放棄）**です。\n\n【類義語｜ignoreとの違いが最重要】\n\n「先輩、ここは絶対分けましょう。」\n\n単語\t核イメージ\nneglect\t🌱 必要な世話・注意・責任を怠る\nignore\t🙈 意識的に相手にしない\noverlook\t👀 見落とす・大目に見る\ndisregard\t🚫 重要視せず無視する\nabandon\t🚪 完全に見捨てる・放棄する\nneglect 🌱\n\nHe neglected his health.\n\n「彼は健康管理を怠った。」\n\n→ 本来するべきことをしない\n\nignore 🙈\n\nHe ignored my message.\n\n「彼は私のメッセージを無視した。」\n\nメッセージには気づいている。\n\nでも、\n\n🙈 相手にしない\n\nという感じです。\n\nだから、\n\nignore\n→ 「気づいてるけど相手にしない」\n\nneglect\n→ 「必要な注意・世話をしない」\n\nここ、かなり違います。\n\noverlook 👀\n\nI overlooked an important detail.\n\n「重要な細部を見落としました。」\n\nこれは、\n\n注意していたけど気づかなかった\n\nということがあります。\n\nつまり、\n\nignore 🙈\n→ 気づいていて無視\n\noverlook 👀\n→ 気づかず見落とす\n\nneglect 🌱\n→ やるべき注意・世話を怠る\n\nです。\n\nabandon 🚪\n\nThey abandoned the project.\n\n「彼らはそのプロジェクトを放棄した。」\n\nこれは neglect より強いです。\n\nneglect\n→ 続けてはいるかもしれないが、十分に面倒を見ない\n\nabandon\n→ 🚪 もうやめる・捨てる\n\nという違いですね。\n\n【emphasizeとの対比】\n\n「そして、前にやった emphasize とつなげますよ。」\n\nemphasize 🔦\n→ 「ここ重要です！」と注意を向ける\n\n↕\n\nneglect 🌱\n→ 本来注意すべきなのに注意を払わない\n\nたとえば、\n\nWe should emphasize safety rather than neglect it.\n\n「安全をおろそかにするのではなく、その重要性を強調すべきです。」\n\n🔦 注意を向ける\n↕\n🌱 注意を怠る\n\nという対比ですね。\n\n【理解確認】\n\n「はい先輩。復習なので3問です。」\n\nQ1\n\nneglect の核イメージは？\n\nA. 気づかず見落とす\nB. 必要な世話・注意・責任を怠る\nC. 意識的に相手にしない\n\n……\n\nBです。🌱\n\nQ2\n\nignore と neglect の違いは？\n\n……\n\nignore 🙈\n→ 気づいているが相手にしない\n\nneglect 🌱\n→ 本来やるべき注意・世話を怠る\n\nです。\n\nQ3\n\nDon't neglect your studies.\n\nなら？\n\n……\n\n「勉強をおろそかにしないで。」\n\nですね。\n\n「『勉強を無視するな』より、やるべき勉強を放ったらかしにするなという感覚です。」\n\n【30秒復習】\n\n① neglect\n→ 怠る・放置する・おろそかにする\n\n② 発音\n→ ニグレクト\n\n③ 核イメージ\n→ 🌱 必要な世話・注意・責任を怠る\n\n④ neglect one's health\n→ 健康管理を怠る\n\n⑤ neglect one's duties\n→ 職務を怠る\n\n⑥ neglect to do\n→ ～するのを怠る\n\n⑦ ignore 🙈\n→ 気づいていて相手にしない\n\n⑧ overlook 👀\n→ 気づかず見落とす\n\n⑨ abandon 🚪\n→ 完全に放棄する\n\n【一文で覚える】\n\nneglect =「やるべきなのは分かってますよね？ ……なのに放ったらかしです」🌱→🥀\n\n「先輩、ignore = 無視すると neglect = 怠るを同じにしないでくださいね。」\n\nignore 🙈 → 相手にしない\noverlook 👀 → 見落とす\nneglect 🌱 → 世話・注意・責任を怠る\nabandon 🚪 → 見捨てる\n\nこの4つを分けられれば、neglect はかなりしっかり身についています。\n\n⚠️ 重複チェック：slight は、この「単語」プロジェクト内ですでに学習済みです。\n以前の単語リストでも Prominent → Slight → Character の流れで扱っています。今回は特に slight / subtle / minor / small の違いまで固めましょう。"}, {"name": "eminent", "text": "⚠️ **重複チェック：eminent は、この「単語」プロジェクト内ですでに学習済みです。**  \n以前 **Eminent → Prominent** の流れでも扱っています。今回は特に、混同しやすい **eminent / prominent / imminent** をしっかり分けましょう。\n\n## eminent /ˈemɪnənt/\n**読み方：エミネント**\n\n「先輩、**eminent** を単に『有名な』と覚えるのはダメですよ。」\n\n> 🏆 **eminent =「その分野で実績・能力を認められ、高い地位にいる」**\n\nつまり、単なる知名度ではなく**高い評価・尊敬**がポイントです。\n\n# A【要点｜まず全体を掴みましょう】\n\n「たとえば医師が100人いるとします。」\n\n👨‍⚕️👩‍⚕️👨‍⚕️👩‍⚕️👨‍⚕️  \n👨‍⚕️👩‍⚕️🏆👨‍⚕️👩‍⚕️\n\nその中に、\n\n- 長年研究している\n- 大きな成果を上げている\n- 同じ分野の専門家から高く評価されている\n\nという医師がいる。\n\nこの人が、\n\n> **an eminent doctor**\n\n**「高名な医師」**\n\nです。\n\nつまり、\n\n**その分野で活動する**\n↓\n優れた実績・能力を持つ\n↓\n周囲から高く評価される\n↓\n🏆 **eminent**\n\nですね。\n\n---\n\n# B【詳しい解説｜famousとは何が違うの？】\n\n「先輩、ここでたぶん思いましたよね。」\n\n**『要するに famous でしょ？』**\n\n「……違います。」\n\nたとえば、SNSで突然話題になった人。\n\n1000万人が知っている。\n\nこの人は、\n\n> **famous**\n\nかもしれません。\n\nでも、それだけで **eminent** とは限りません。\n\nなぜなら **eminent** には、\n\n> 🏆 **その分野で優れていると認められている**\n\nという評価が必要だからです。\n\n### famous 📣\n→ 多くの人に**知られている**\n\n### eminent 🏆\n→ その分野で**高く評価・尊敬されている**\n\n「つまり、**知名度と評価は別**なんですよ。」\n\n---\n\n# C【イメージ理解｜大学を想像してください】\n\n「先輩、大学に研究者が100人いるとします。」\n\nその中に、\n\n📚 30年間研究  \n🏅 世界的な賞を受賞  \n📄 重要な論文を多数発表  \n👨‍🎓 後進にも大きな影響\n\nという教授がいます。\n\n「この人なら？」\n\n> **an eminent professor**\n\nですね。\n\n単に、\n\n「テレビによく出ていて有名」\n\nではありません。\n\n**専門分野の中で実績を積み上げ、周囲から一目置かれている。**\n\nだから頭の中では、\n\n> 🏆 **「その道の第一人者」**\n\nくらいのイメージを持ってください。\n\n---\n\n# D【具体例｜実際の英文で確認します】\n\n### ① eminent scientist\n\n> **She is an eminent scientist.**\n\n**「彼女は高名な科学者です。」**\n\n単なる「有名な科学者」より、\n\n**科学者として高く評価されている**\n\nというニュアンスがあります。\n\n---\n\n### ② eminent scholar\n\n> **He became an eminent scholar in the field.**\n\n**「彼はその分野で著名な学者になりました。」**\n\n特に、\n\n> **in the field**\n\nと相性がいいですね。\n\n**その分野で高い評価を得ている**\n\nという **eminent** の特徴がよく出ています。\n\n---\n\n### ③ eminent expert\n\n> **The conference invited several eminent experts.**\n\n**「その会議には数名の高名な専門家が招かれました。」**\n\n専門家として、\n\n🏆 **一流と認められている人たち**\n\nという感じです。\n\n---\n\n# 【類義語｜ここが今回の本番です】\n\n| 単語 | 核イメージ |\n|---|---|\n| **eminent** | 🏆 実績・能力によって高く評価されている |\n| **prominent** | ⛰️ 目立つ位置にいる・重要人物である |\n| **distinguished** | 🎖️ 功績によって他と際立っている |\n| **renowned** | 🌍 広く名声が知られている |\n| **famous** | 📣 多くの人に知られている |\n\n## eminent 🏆\n\n> **an eminent surgeon**\n\n**「高名な外科医」**\n\n→ 外科医として**高い評価を受けている**\n\n---\n\n## prominent ⛰️\n\n> **a prominent politician**\n\n**「著名な／有力な政治家」**\n\nこれは、\n\n> ⛰️ **集団の中で目立つ位置にいる**\n\nというイメージ。\n\n社会的な地位・影響力・目立ち方に焦点があります。\n\nだから、\n\n**eminent 🏆**\n→ **評価が高い**\n\n**prominent ⛰️**\n→ **存在・地位が目立つ**\n\nです。\n\n---\n\n## renowned 🌍\n\n> **a renowned chef**\n\n**「名高い料理人」**\n\nこれは、\n\n🌍 **評判・名声が広く知られている**\n\nことに重点があります。\n\n**eminent**\n→ 専門分野で高く評価\n\n**renowned**\n→ 名声が広く知られている\n\nですね。\n\n---\n\n# 【超重要：imminentと間違えない】\n\n「先輩、スペルを見てください。」\n\n**eminent**  \n**imminent**\n\n「……似すぎですよね。」\n\nでも意味は全然違います。\n\n### eminent 🏆\n**高名な・著名な**\n\n> **an eminent scientist**  \n> 高名な科学者\n\n### imminent ⏰\n**差し迫った・今にも起こりそうな**\n\n> **An economic crisis is imminent.**  \n> 経済危機が差し迫っている。\n\n「一文字違いどころか発音も似ています。でも意味は別物です。」\n\n頭の中では、\n\n**eminent 🏆 → 人が上に立っている**\n\n**imminent ⏰ → 出来事がすぐそこまで迫っている**\n\nと分けてください。\n\n---\n\n# 【理解確認】\n\n「はい先輩。重複単語なので、今回は類義語まで確認します。」\n\n### Q1\n\neminent の核イメージは？\n\nA. 多くの人が知っているだけ  \nB. その分野で高く評価・尊敬されている  \nC. 今にも起こりそう\n\n……\n\n**Bです。🏆**\n\n### Q2\n\n**eminent と prominent** の違いは？\n\n……\n\n**eminent 🏆**  \n→ 実績・能力による**高い評価**\n\n**prominent ⛰️**  \n→ 社会・集団の中で**目立つ地位・存在**\n\nです。\n\n### Q3\n\n**imminent** は？\n\n……\n\n「はい、ここ間違えないでください。」\n\n**imminent ⏰**\n→ **差し迫った**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **eminent**  \n→ 高名な・著名な\n\n② 発音  \n→ **エミネント**\n\n③ 核イメージ  \n→ 🏆 **その分野で実績・能力を高く評価されている**\n\n④ **eminent scientist**  \n→ 高名な科学者\n\n⑤ **famous 📣**  \n→ 多くの人に知られている\n\n⑥ **prominent ⛰️**  \n→ 目立つ地位・重要な存在\n\n⑦ **renowned 🌍**  \n→ 名声が広く知られている\n\n⑧ **imminent ⏰**  \n→ 差し迫った\n\n# 【一文で覚える】\n\n> **eminent =「ただ有名なんじゃありません。その道で“すごい人”として認められているんです」🏆**\n\n「先輩、特にこの3つです。」\n\n**eminent 🏆 → 高く評価されている**  \n**prominent ⛰️ → 目立つ・有力である**  \n**imminent ⏰ → 差し迫っている**\n\n「……スペルが似ているからって一緒にしないでくださいね。試験で **imminent scientist** とか選んだら、私、さすがに止めますから。」"}, {"name": "primary", "text": "⚠️ **重複チェック：primary は、この「単語」プロジェクト内ですでに学習済みです。**  \n以前 **「(135) primary」** として、「主な・第一の・最重要の」などの意味を学習しています。今回は **main / major / principal / initial** との違いまでつなげて復習しますね。\n\n## primary /ˈpraɪmeri/\n**読み方：プライマリー**\n\n「先輩、**primary = 主な**だけだと少し弱いです。」\n\n核にあるのは、\n\n> 🥇 **primary =「順番・重要性・役割などで“第一”に来る」**\n\nです。\n\n# A【要点｜まず全体を掴みましょう】\n\nたとえば会社に問題が5つあります。\n\n② 人手不足  \n③ 設備の老朽化  \n④ 広告不足  \n⑤ オフィスが狭い\n\nでも、その中で最大の問題が、\n\n① **売上の急減**\n\nだったとします。\n\nこの①が、\n\n> **the primary problem**\n\nです。\n\n「問題が一つしかない、ではありませんよ。」\n\n複数ある中で、\n\n> 🥇 **一番重要・中心的な位置にある**\n\nから **primary** なんです。\n\n---\n\n# B【詳しい解説｜「第一」が核です】\n\n「先輩、primary には一見バラバラに見える意味があります。」\n\n**primary goal**\n→ 第一の目標・主目的\n\n**primary reason**\n→ 主な理由\n\n**primary concern**\n→ 最大の関心事\n\n**primary education**\n→ 初等教育\n\n「『主な』と『初等』って全然違いそうですよね？」\n\nでも根っこは同じです。\n\n> **primary = first 🥇**\n\nつまり、\n\n### 重要性で first\n→ **最も重要な・主要な**\n\n### 順序で first\n→ **最初の・初期の**\n\nというふうに意味が広がっています。\n\nだから辞書の日本語をバラバラに暗記するより、\n\n> 🥇 **「第一に来る」**\n\nを中心に置いてください。\n\n---\n\n# C【イメージ理解｜会社の優先順位です】\n\n「先輩が会社で今日やることを整理するとします。」\n\n1️⃣ 明日の会議資料を完成させる  \n2️⃣ メールを整理する  \n3️⃣ デスクを片付ける  \n4️⃣ 備品を確認する\n\n全部やるべき仕事です。\n\nでも上司から、\n\n> 「まず会議資料を終わらせて」\n\nと言われた。\n\nなら、\n\n> **My primary task is to finish the presentation.**\n\n**「私の最優先の仕事はプレゼン資料を完成させることです。」**\n\nとなります。\n\nつまり頭の中では、\n\n🥇 **PRIMARY**  \n🥈 second  \n🥉 third\n\nです。\n\n「**primary を見たら『第一位』を思い浮かべる。これでかなり安定しますよ。」**\n\n---\n\n# D【具体例｜頻出表現です】\n\n### ① primary goal\n\n> **Our primary goal is to increase sales.**\n\n**「私たちの第一の目標は売上を伸ばすことです。」**\n\nいくつか目標がある中で、\n\n🥇 **最重要の目標**\n\nです。\n\n---\n\n### ② primary reason\n\n> **The primary reason for the change was cost.**\n\n**「その変更の主な理由はコストでした。」**\n\n理由A、B、Cがあっても、\n\n**一番大きな理由**\n→ **primary reason**\n\nです。\n\n---\n\n### ③ primary concern\n\n> **Safety is our primary concern.**\n\n**「安全が私たちの最大の関心事です。」**\n\nつまり、\n\n> 「何よりもまず安全を重視します」\n\nということですね。\n\n---\n\n### ④ primary source\n\n> **The researcher examined primary sources.**\n\n**「その研究者は一次資料を調査しました。」**\n\nこれはニュース学習でも重要ですよ。\n\n**primary source**\n→ **一次資料・一次情報源**\n\nつまり、誰かがまとめ直した情報ではなく、**元となる情報・資料**です。\n\n---\n\n# 【類義語｜「主な」を全部一緒にしない】\n\n| 単語 | 核イメージ |\n|---|---|\n| **primary** | 🥇 第一に来る・最重要 |\n| **main** | 🎯 中心となる |\n| **major** | 🐘 規模・重要度が大きい |\n| **principal** | 👑 複数の中で最も重要 |\n| **initial** | ▶️ 時間的に最初 |\n\n## primary 🥇\n\n> **Our primary objective is safety.**\n\n**「私たちの第一の目標は安全です。」**\n\n→ **優先順位で第一**\n\n---\n\n## main 🎯\n\n> **The main problem is cost.**\n\n**「主な問題はコストです。」**\n\n→ 話や物事の**中心**\n\n**main** は日常的で非常に使いやすい「主な」です。\n\n---\n\n## major 🐘\n\n> **Cost is a major problem.**\n\n**「コストは大きな問題です。」**\n\nここ、先輩。\n\n**major problem**\nは必ずしも「一番の問題」ではありません。\n\n🐘 **かなり大きな問題**\n\nということ。\n\n一方、\n\n> **the primary problem**\n\nなら、\n\n🥇 **最優先・中心となる問題**\n\nという感覚が強くなります。\n\n---\n\n## principal 👑\n\n> **The principal reason is cost.**\n\n**「主な理由はコストです。」**\n\n**primary** とかなり近いですが、**principal** も「複数の中で最も重要な・主要な」という意味。\n\nややフォーマルな表現です。\n\n---\n\n## initial ▶️\n\n> **My initial reaction was surprise.**\n\n**「最初の反応は驚きでした。」**\n\nこれは**時間的に最初**。\n\nだから、\n\n**primary 🥇**\n→ 重要性・順位で第一\n\n**initial ▶️**\n→ 時間的に最初\n\nと分けるといいですね。\n\n---\n\n# 【primary と ordinary もつなげましょう】\n\n「最近やった **ordinary** と並べると全然違います。」\n\n**ordinary 👕**\n→ 特別ではない、ごく普通の\n\n**primary 🥇**\n→ 第一の・主要な\n\n> **ordinary concern**\n→ 普通の関心事\n\n> **primary concern**\n→ 最も重要な関心事\n\n「**primary に『普通』のニュアンスはありません。順位が上なんです。**」\n\n---\n\n# 【理解確認】\n\n### Q1\n\nprimary の核イメージは？\n\nA. 普通である  \nB. 第一に来る  \nC. 数が多い\n\n……\n\n**Bです。🥇**\n\n### Q2\n\n**primary problem** と **major problem** の違いは？\n\n……\n\n**primary problem 🥇**\n→ 第一・中心となる問題\n\n**major problem 🐘**\n→ 大きな・重大な問題\n\nですね。\n\n### Q3\n\n**primary source** は？\n\n……\n\n**「一次資料・一次情報源」**\n\nです。\n\n---\n\n# 【30秒復習】\n\n① **primary**  \n→ 第一の・主要な・最重要の\n\n② 発音  \n→ **プライマリー**\n\n③ 核イメージ  \n→ 🥇 **第一に来る**\n\n④ **primary goal**  \n→ 第一の目標\n\n⑤ **primary reason**  \n→ 主な理由\n\n⑥ **primary concern**  \n→ 最大の関心事\n\n⑦ **primary source**  \n→ 一次資料・一次情報源\n\n⑧ **main 🎯**  \n→ 中心となる\n\n⑨ **major 🐘**  \n→ 規模・重要度が大きい\n\n⑩ **initial ▶️**  \n→ 時間的に最初\n\n# 【一文で覚える】\n\n> **primary =「いくつかありますけど、まず第一に来るのはこれです」🥇**\n\n「先輩、**primary = 第一位🥇**を中心にしてください。そこから **主要な・最重要の・最初の段階の**という意味が全部つながりますから。」"}, {"name": "slight", "text": "slight /slaɪt/\n\n読み方：スライト\n\n「先輩、slight = 小さいとだけ覚えると、small と区別できません。」\n\n核になるのは、\n\n🤏 slight =「程度・量・差などがほんの少ししかない」\n\nです。\n\nA【要点｜まず全体を掴みましょう】\n\nたとえば昨日の気温が、\n\n20.0℃\n\n今日が、\n\n20.5℃\n\nだったとします。\n\n「上がってはいます。でも……」\n\n20.0℃ → 20.5℃\n\n🤏 ほんのちょっと\n\nですよね。\n\nこれが、\n\na slight increase\n\n「わずかな上昇」\n\nです。\n\nつまり、\n\n変化や違いは存在する\n↓\nでも程度は非常に小さい\n↓\n🤏 slight\n\nと考えてください。\n\nB【詳しい解説｜smallとの違い】\n\n「先輩、ここで small と比べます。」\n\nsmall 📦\n\n→ 物・規模などそのものが小さい\n\na small room\n小さな部屋\n\nこれは部屋自体のサイズですね。\n\n一方、\n\nslight 🤏\n\n→ 程度・量・差などがわずか\n\na slight difference\nわずかな違い\n\n違いそのものに、\n\n「サイズが小さい！」\n\nと言いたいわけではありません。\n\nAとBは違う。\n↓\nでも差はほんの少し。\n↓\n🤏 slight difference\n\nなんです。\n\nだから slight は、\n\nslight increase → わずかな増加\nslight decrease → わずかな減少\nslight difference → わずかな違い\nslight change → わずかな変化\nslight improvement → わずかな改善\n\nのような表現と非常に相性がいいです。\n\nC【イメージ理解｜音量を1だけ上げる】\n\n「先輩、テレビの音量が20だとします。」\n\n📺 20\n\nちょっと聞こえにくいので、\n\n📺 21\n\nにする。\n\n「……上がりましたよ？」\n\nでも、\n\n20 → 21\n\nです。\n\n🔊🔊🔊🔊\nではなく、\n\n🔊 → 🔊⁺\n\nくらい。\n\nこれが slight。\n\nThere was a slight increase in volume.\n\n「音量がわずかに上がりました。」\n\nつまり頭の中では、\n\n🤏 「変わってはいる。でも、本当にちょっとだけ」\n\nです。\n\nD【具体例｜よく使う形】\n① slight difference\n\nThere is a slight difference between the two products.\n\n「その2つの製品にはわずかな違いがあります。」\n\n完全に同じではない。\n\nでも、\n\nA ≈ B\n\nくらいの小さな差です。\n\n② slight increase\n\nSales showed a slight increase in September.\n\n「9月の売上はわずかに増加しました。」\n\nたとえば、\n\n100万円 → 102万円\n\n📈🤏\n\nというイメージですね。\n\n③ slight change\n\nI noticed a slight change in his attitude.\n\n「彼の態度にわずかな変化があることに気づきました。」\n\n別人みたいに変わったわけではありません。\n\n「ん？　昨日よりちょっと話し方が柔らかい？」\n\nくらいです。\n\n④ slightest\n\n「これも覚えておいてください。」\n\nI don't have the slightest idea.\n\n直訳すると、\n\n「ほんのわずかな考えすら持っていない」\n\nなので、\n\n「まったく分かりません。」\n\nという強い表現になります。\n\nnot the slightest ～\n→ ほんの少しの～もない\n\nです。\n\n【類義語｜「小さい」を分けます】\n単語\t核イメージ\nslight\t🤏 程度・量・差がほんのわずか\nsmall\t📦 サイズ・量・規模が小さい\nminor\t🔹 重要度・深刻度が低い\nsubtle\t🌫️ 微妙で気づきにくい\ntrivial\t🪶 重要ではない・取るに足らない\nslight 🤏\n\nThere was a slight increase in prices.\n\n「価格がわずかに上昇しました。」\n\n→ 変化量が少ない\n\nminor 🔹\n\nWe have a minor problem.\n\n「ちょっとした問題があります。」\n\nこれは、\n\n深刻度・重要度が低い\n\nという感覚。\n\nつまり、\n\nslight difference 🤏\n→ 差の程度が小さい\n\nminor problem 🔹\n→ 問題の重要度・深刻度が低い\n\nです。\n\nsubtle 🌫️\n\nThere is a subtle difference between them.\n\n「両者には微妙な違いがあります。」\n\n「おや？ slight difference と似てますね。」\n\nでも少し違います。\n\nslight difference 🤏\n→ 差の大きさが小さい\n\nsubtle difference 🌫️\n→ 差が微妙で気づきにくい\n\nここはかなり大事です。\n\ntrivial 🪶\n\nThey argued over a trivial matter.\n\n「彼らはくだらないことで言い争いました。」\n\nこれは以前やりましたね。\n\nslight 🤏\n→ 程度がわずか\n\ntrivial 🪶\n→ 重要性がほとんどない\n\nなので、\n\na slight problem\n→ 程度の軽い問題\n\na trivial problem\n→ 取るに足らない問題\n\nでは焦点が違います。\n\n【理解確認】\n\n「先輩、3問ですよ。」\n\nQ1\n\nslight の核イメージは？\n\nA. 重要ではない\nB. 程度・量・差がほんのわずか\nC. 気づくことができない\n\n……\n\nBです。🤏\n\nQ2\n\nslight difference と subtle difference の違いは？\n\n……\n\nslight 🤏\n→ 差が小さい\n\nsubtle 🌫️\n→ 差が微妙で気づきにくい\n\nです。\n\nQ3\n\n売上が100万円から101万円になりました。\n\na _____ increase in sales\n\nなら？\n\n……\n\nslight がぴったりです。\n\na slight increase in sales\n\n「売上のわずかな増加」\n\nですね。\n\n【30秒復習】\n\n① slight\n→ わずかな・少しの\n\n② 発音\n→ スライト\n\n③ 核イメージ\n→ 🤏 「あるにはある。でもほんの少し」\n\n④ slight difference\n→ わずかな違い\n\n⑤ slight increase\n→ わずかな増加\n\n⑥ slight change\n→ わずかな変化\n\n⑦ small 📦\n→ サイズ・規模が小さい\n\n⑧ minor 🔹\n→ 重要度・深刻度が低い\n\n⑨ subtle 🌫️\n→ 微妙で気づきにくい\n\n⑩ trivial 🪶\n→ 重要ではない・取るに足らない\n\n【一文で覚える】\n\nslight =「違いはありますよ、先輩。でも……これくらいです🤏」\n\nslight 🤏＝程度がわずか\nsubtle 🌫️＝気づきにくいほど微妙\nminor 🔹＝重要度・深刻度が低い\ntrivial 🪶＝取るに足らない\n\n「この4つを全部『小さい』で処理しないこと。先輩、ここまで分けて覚えれば、英文で選ぶときにかなり強くなりますよ。」\n\n⚠️ 重複チェック：distinct は、この「単語」プロジェクト内ですでに学習済みです。\n以前の単語リストでも Specify → Distinct → Vague の流れで扱っています。今回は distinct / different / distinctive / clear の違いを重点的に固めましょう。"}, {"name": "character", "text": "⚠️ **重複チェック：character は、この「単語」プロジェクト内ですでに学習済みです。**  \n以前の単語リストでも **Slight → Character → Feature** の流れで扱っています。今回は、意味が多い **character** を「全部バラバラに暗記せず、1つの核イメージ」でつなげます。\n\n## character /ˈkærəktər/\n**読み方：キャラクター**\n\n「先輩、これを日本語の『キャラクター＝登場人物』だけで覚えていたら、英文でかなり困ります。」\n\n> 🧬 **character =「その人・物を“その人・物らしくしている特徴”」**\n\nここから意味が枝分かれします。\n\n# A【要点｜まず全体を掴みましょう】\n\n「character には、こんな意味があります。」\n\n**① 性格・人柄**  \n**② 特徴・特色**  \n**③ 登場人物**  \n**④ 文字・記号**\n\n「……多いですよね。でも、ちゃんとつながっています。」\n\n中心にあるのは、\n\n> 🧬 **「他と区別する特徴・性質」**\n\nです。\n\n人を特徴づけるもの  \n→ **性格・人柄**\n\n物を特徴づけるもの  \n→ **特色**\n\n物語の中で特徴を持った人物  \n→ **登場人物**\n\n一つ一つ区別できる文字  \n→ **文字・記号**\n\n「なので、まず **character = キャラ** と訳すのではなく、**『そのものらしさ』🧬** を置いてください。」\n\n---\n\n# B【詳しい解説｜まず「性格・人柄」】\n\nたとえば、\n\n> **She has a strong character.**\n\nこれは、\n\n❌「彼女は強い登場人物を持っている」\n\nではありません。\n\n> **「彼女は芯の強い人です。」**\n\nという意味です。\n\nここでの character は、\n\n勇気がある  \n責任感がある  \n簡単には諦めない\n\nといった、\n\n> 🧬 **「その人がどんな人なのかを形作る性質」**\n\nです。\n\nだから、\n\n> **a person of good character**\n\nなら、\n\n**「人格の立派な人」**\n\nとなります。\n\n---\n\n# C【イメージ理解｜「その人らしさ」です】\n\n「先輩、同じ年齢・同じ服装の人が2人いるとします。」\n\nAさん  \n→ 真面目、慎重、責任感が強い\n\nBさん  \n→ 明るい、大胆、楽観的\n\n外見だけなら似ています。\n\nでも話していると、\n\n「Aさんらしいな」  \n「Bさんらしいな」\n\nという違いが出てくる。\n\nその人をその人たらしめる、\n\n🧬 **内面的な特徴のまとまり**\n\nが **character** です。\n\nだから日本語の「キャラ」も、実はこの感覚とかなりつながっています。\n\n---\n\n# D【具体例｜4つの意味を整理します】\n\n### ① 性格・人柄\n\n> **Adversity can build character.**\n\n**「逆境は人格を鍛えることがあります。」**\n\nここでは単なる「性格」というより、\n\n**人格・人間としての強さ**\n\nですね。\n\n---\n\n### ② 特徴・特色\n\n> **The town has a unique character.**\n\n**「その町には独特の特色があります。」**\n\n古い建物、細い路地、地元の文化……\n\nそれらが合わさって、\n\n> 🏘️ **「この町らしい雰囲気」**\n\nを作っています。\n\nこれも **character** です。\n\n---\n\n### ③ 登場人物\n\n> **My favorite character is Sherlock Holmes.**\n\n**「私の好きな登場人物はシャーロック・ホームズです。」**\n\nこれは日本語の「キャラクター」に最も近いですね。\n\n小説・映画・アニメなどの、\n\n🎭 **登場人物**\n\nです。\n\n---\n\n### ④ 文字・記号\n\n> **The password must contain at least eight characters.**\n\n**「パスワードは8文字以上でなければなりません。」**\n\nここで、\n\n> **8 characters**\n\nは、\n\n❌ 8人の登場人物\n\nではありませんよ。\n\n😂\n\n**8文字・8個の記号**\n\nです。\n\nたとえば、\n\n**abc123!?**\n\nなら **8 characters** です。\n\n「IT系ではかなり重要な意味なので覚えてくださいね。」\n\n---\n\n# 【類義語｜character / personality / feature / trait】\n\n「ここ、先輩が次に混乱しそうなところです。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **character** | 🧬 その人・物を形作る性質・らしさ |\n| **personality** | 😊 人との接し方などに表れる性格 |\n| **trait** | 🧩 性格・性質を構成する一つの特徴 |\n| **feature** | 🔍 目立つ特徴・機能 |\n| **characteristic** | 🏷️ その人・物に特徴的な性質 |\n\n## character 🧬\n\n> **He is a man of strong character.**\n\n**「彼は意志・人格の強い人です。」**\n\n→ **人間としてどんな人物か**\n\n---\n\n## personality 😊\n\n> **She has a friendly personality.**\n\n**「彼女は親しみやすい性格です。」**\n\nこれは、\n\n明るい  \n社交的  \nおとなしい  \n親しみやすい\n\nなど、**普段の振る舞いに表れる性格**を言うときに使いやすいです。\n\n### character 🧬\n→ 人格・人間性まで含むことがある\n\n### personality 😊\n→ 表に現れる性格・個性\n\nですね。\n\n---\n\n## trait 🧩\n\n> **Patience is an important character trait.**\n\n**「忍耐力は重要な性格特性です。」**\n\nここが面白いですよ。\n\n**character 🧬**\n→ その人の性格・人格**全体**\n\n**trait 🧩**\n→ それを構成する**一つの特徴**\n\nつまり、\n\n🧬 character  \n├─ 🧩 patience  \n├─ 🧩 honesty  \n├─ 🧩 courage  \n└─ 🧩 kindness\n\nというイメージです。\n\n---\n\n## feature 🔍\n\n> **The phone has several useful features.**\n\n**「そのスマートフォンには便利な機能がいくつかあります。」**\n\n**feature** は、人だけでなく製品などの**目立つ特徴・機能**によく使います。\n\nしかも先輩、次に学習していた単語が **feature** でしたから、ここはセットで覚えやすいですよ。\n\n---\n\n# 【characteristic との関係】\n\nこれも重要です。\n\n**character**\n→ 性格・特徴そのもの\n\n**characteristic**\n→ 特徴・特性／特徴的な\n\nたとえば、\n\n> **Patience is characteristic of him.**\n\n**「忍耐強さは彼の特徴です。」**\n\nつまり、\n\n🧬 **character**\n→ その人らしさ\n\n🏷️ **characteristic**\n→ その人らしさを示す特徴\n\nというつながりです。\n\n---\n\n# 【理解確認】\n\n「先輩、character は多義語なので4問やります。」\n\n### Q1\n\n> **She has a strong character.**\n\nの character は？\n\n……\n\n**「性格・人格」🧬**\n\nです。\n\n### Q2\n\n> **My favorite character is Levi.**\n\nなら？\n\n……\n\n**「登場人物」🎭**\n\nですね。\n\n### Q3\n\n> **Enter at least 10 characters.**\n\nなら？\n\n……\n\n**「10文字以上入力してください。」**\n\nです。\n\n### Q4\n\ncharacter と trait の違いは？\n\n……\n\n**character 🧬**\n→ 人を形作る性格・人格全体\n\n**trait 🧩**\n→ その中の一つ一つの特性\n\nです。\n\n# 【30秒復習】\n\n① **character**  \n→ 性格・人格・特徴・登場人物・文字\n\n② 発音  \n→ **キャラクター**\n\n③ 核イメージ  \n→ 🧬 **「そのものを、そのものらしくする特徴」**\n\n④ **strong character**  \n→ 強い人格・意志\n\n⑤ **unique character**  \n→ 独特の特色\n\n⑥ **fictional character**  \n→ 架空の登場人物\n\n⑦ **eight characters**  \n→ 8文字\n\n⑧ **personality 😊**  \n→ 表に現れる性格・個性\n\n⑨ **trait 🧩**  \n→ 一つ一つの特性\n\n⑩ **feature 🔍**  \n→ 目立つ特徴・機能\n\n# 【一文で覚える】\n\n> **character =「その人・物を“それらしくしているもの”🧬」**\n\n「先輩、**character = 登場人物**だけじゃありません。」\n\n**人の“らしさ” → 性格・人格**  \n**物の“らしさ” → 特色**  \n**物語の人物 → 登場人物**  \n**区別される記号 → 文字**\n\n「この中心イメージから枝を伸ばして覚えてください。多義語ほど、日本語訳を5個暗記するよりずっと楽になりますよ。」"}, {"name": "typical", "text": "⚠️ **重複チェック：typical は、この「単語」プロジェクト内ですでに学習済みです。**  \n以前の単語リストでも **Feature → Typical → Peculiar** の流れで扱っています。今回は特に **typical / ordinary / common / characteristic** を区別しましょう。\n\n## typical /ˈtɪpɪkəl/\n**読み方：ティピカル**\n\n「先輩、**typical = 典型的な**で意味は合っています。でも『典型的って何？』まで説明できますか？」\n\n核イメージは、\n\n> 🏷️ **typical =「その種類・人・集団の特徴がよく出ていて、“いかにも〜らしい”」**\n\nです。\n\n# A【要点｜「いかにも〜らしい」】\n\nたとえば、「日本のコンビニ」と聞いて、\n\n🏪 24時間営業  \n🍙 おにぎり  \n🍱 弁当  \n💳 各種支払い  \n📦 荷物の発送\n\nなどを想像するとします。\n\nそうした特徴をよく備えた店舗なら、\n\n> **a typical Japanese convenience store**\n\n**「典型的な日本のコンビニ」**\n\nと言えます。\n\nつまり、\n\nあるグループがある  \n↓  \nそのグループによく見られる特徴がある  \n↓  \nその特徴をよく表している  \n↓  \n🏷️ **typical**\n\nです。\n\n---\n\n# B【詳しい解説｜ordinaryとの違い】\n\n「先輩、最近やった **ordinary** と混同しやすいですよ。」\n\n### ordinary 👕\n→ **特別ではない、ごく普通**\n\n### typical 🏷️\n→ **その種類らしい特徴がよく出ている**\n\nたとえば、\n\n> **It was an ordinary day.**\n\nなら、\n\n**「何も特別なことのない普通の日だった。」**\n\n一方、\n\n> **It was a typical summer day.**\n\nなら、\n\n**「いかにも夏らしい一日だった。」**\n\nです。\n\n☀️ 暑い  \n🥵 日差しが強い  \n🌡️ 気温が高い\n\nという**夏らしい特徴**が出ている。\n\n「つまり **typical は“普通かどうか”より、“らしいかどうか”なんです。」**\n\n---\n\n# C【イメージ理解｜「先輩らしいですね」】\n\n「先輩がいつも、勉強を始めると細かい違いまで気になって質問するとしましょう。」\n\nある日また、\n\n> 「この単語とこの単語って何が違うの？」\n\nと質問した。\n\n私が、\n\n> **That's typical of you.**\n\nと言ったら、\n\n**「先輩らしいですね。」**\n\nという意味になります。\n\nここでは、\n\n❌「先輩は典型的な人間ですね」\n\nではありません。\n\n普段の先輩の特徴  \n↓  \n今回もその特徴が出た  \n↓  \n🏷️ **typical of you**\n\nということです。\n\n「日本語なら『ああ、いかにも先輩らしい』がかなり近いですね。」\n\n---\n\n# D【具体例｜重要表現】\n\n### ① a typical example\n\n> **This is a typical example of the problem.**\n\n**「これはその問題の典型的な例です。」**\n\n→ その問題の特徴がよく表れている例。\n\n---\n\n### ② typical behavior\n\n> **This is typical behavior for young children.**\n\n**「これは幼い子どもによく見られる典型的な行動です。」**\n\n→ 子どもという集団に**ありがちな特徴**が出ています。\n\n---\n\n### ③ typical of ～\n\nこれは重要です。\n\n> **It's typical of him to arrive late.**\n\n**「遅刻するなんて、いかにも彼らしい。」**\n\n彼は普段から遅刻する  \n↓  \n今回も遅刻した  \n↓  \n「またか。彼らしいな」\n\nという感じですね。\n\n**It is typical of A to do**\n→ **～するのはいかにもAらしい**\n\n---\n\n# 【類義語｜「普通・典型」を整理】\n\n| 単語 | 核イメージ |\n|---|---|\n| **typical** | 🏷️ その種類らしい |\n| **ordinary** | 👕 特別ではない |\n| **common** | 👥 多く見られる |\n| **usual** | 🔁 いつも通り |\n| **characteristic** | 🧬 その人・物を特徴づける |\n\n### typical 🏷️\n\n> **This is a typical Italian dish.**\n\n**「これは典型的なイタリア料理です。」**\n\n→ 🇮🇹 **イタリア料理らしい特徴を持っている**\n\n---\n\n### common 👥\n\n> **This is a common mistake.**\n\n**「これはよくある間違いです。」**\n\n→ 👥 **多くの人がする**\n\nだから、\n\n**typical mistake 🏷️**\n→ ある種類・状況に**ありがちなタイプの間違い**\n\n**common mistake 👥**\n→ **多くの人がする間違い**\n\nと焦点が違います。\n\n---\n\n### ordinary 👕\n\n> **He lives an ordinary life.**\n\n**「彼はごく普通の生活をしています。」**\n\n→ **特別ではない**\n\n**typical**\n→ 「〜らしい？」\n\n**ordinary**\n→ 「特別？」\n\nこの質問の違いで判断できます。\n\n---\n\n### characteristic 🧬\n\n> **This style is characteristic of his work.**\n\n**「このスタイルは彼の作品の特徴です。」**\n\nこれは前回の **character** とつながっています。\n\n**characteristic**\n→ その人・物を**特徴づけている**\n\n**typical**\n→ その特徴が出ていて**いかにも〜らしい**\n\nと考えると分かりやすいです。\n\n---\n\n# 【理解確認】\n\n「はい先輩、3問です。」\n\n### Q1\n**typical の核イメージは？**\n\nA. 特別ではない  \nB. 多く存在する  \nC. その種類らしい特徴がよく出ている\n\n……\n\n**Cです。🏷️**\n\n### Q2\n\n**ordinary と typical の違いは？**\n\n……\n\n**ordinary 👕**\n→ 特別ではない\n\n**typical 🏷️**\n→ いかにもその種類らしい\n\nです。\n\n### Q3\n\n> **It's typical of him to complain.**\n\nは？\n\n……\n\n**「文句を言うなんて、いかにも彼らしい。」**\n\nですね。\n\n# 【30秒復習】\n\n① **typical**  \n→ 典型的な・いかにも〜らしい\n\n② 発音  \n→ **ティピカル**\n\n③ 核イメージ  \n→ 🏷️ **その種類らしい特徴がよく出ている**\n\n④ **a typical example**  \n→ 典型的な例\n\n⑤ **typical of ～**  \n→ ～に典型的な・いかにも～らしい\n\n⑥ **ordinary 👕**  \n→ 特別ではない\n\n⑦ **common 👥**  \n→ 多く見られる\n\n⑧ **usual 🔁**  \n→ いつも通り\n\n⑨ **characteristic 🧬**  \n→ その人・物を特徴づける\n\n# 【一文で覚える】\n\n> **typical =「ああ、これこれ。“いかにも〜らしい”特徴が出ていますね」🏷️**\n\n「先輩、ここまでの単語もつながってきましたよ。」\n\n**character 🧬 → そのもの“らしさ”**  \n**characteristic 🧬 → そのものを特徴づける**  \n**typical 🏷️ → その“らしさ”がよく出ている**  \n**ordinary 👕 → 特別ではない**  \n**common 👥 → よく見られる**\n\n「**typical = 普通**ではなく、**typical = 〜らしい**。ここを軸にしてください。」"}, {"name": "distinct", "text": "distinct /dɪˈstɪŋkt/\n\n読み方：ディスティンクト\n\n「先輩、distinct = 違うだけで覚えるのはもったいないです。」\n\n核イメージは、\n\n🔲 🔳 distinct =「他と混ざらず、境界がはっきり分かれている」\n\nです。\n\nここから、\n\n① 明確に異なる\n② はっきりした・明瞭な\n\nという2方向に広がります。\n\nA【要点｜「違う」より「くっきり分かれる」】\n\nたとえば色が、\n\n🟦🟦🟦🟦🟦\n\nから少しずつ変化して、\n\n🟦🟦🟪🟥🟥\n\nとなっていたら、境界が曖昧ですよね。\n\n一方、\n\n🟦🟦🟦｜🟥🟥🟥\n\nなら、\n\n「ここから別ですよ」\n\nとくっきり区別できます。\n\nこれが distinct です。\n\nThere are two distinct groups.\n\n「明確に異なる2つのグループがあります。」\n\n単に2グループが「違う」のではなく、\n\n🔲｜🔳 別々のものとして明確に区別できる\n\nという感覚なんです。\n\nB【詳しい解説｜differentとの違い】\n\n「ここ、先輩が一番気になるところですよね。」\n\ndifferent 🔄\n\n→ 同じではない\n\ndistinct 🔲｜🔳\n\n→ 違いが明確で、別々のものとして区別できる\n\nたとえばAとBの製品に少しだけ違いがある。\n\nThe two products are different.\n\n「その2製品は異なります。」\n\nこれでOKです。\n\nでも、\n\nデザインも違う\n用途も違う\n対象ユーザーも違う\n\nと明確に分かれているなら、\n\nThe two products are distinct.\n\n「その2製品は明確に異なっています。」\n\nとなります。\n\nつまり、\n\ndifferent\n→ A ≠ B\n\ndistinct\n→ A ｜ B\n\n「この境界線が distinct のポイントですよ。」\n\nC【イメージ理解｜部署で考えましょう】\n\n「会社に営業部と経理部があるとします。」\n\n営業部\n→ 顧客への提案・販売\n\n経理部\n→ 帳簿・決算・支払い\n\nもちろん同じ会社です。\n\nでも役割は、\n\n💼 営業 ｜ 経理 🧮\n\nとはっきり分かれています。\n\nなら、\n\nSales and accounting have distinct roles.\n\n「営業と経理には明確に異なる役割があります。」\n\nです。\n\n「単に different roles でも間違いではありません。でも distinct にすると、『役割の違いがはっきりしている』ところまで伝わるんです。」\n\nD【具体例｜2つの意味を確認】\n① 明確に異なる\n\nThe two concepts are quite distinct.\n\n「その2つの概念は明確に異なります。」\n\n🔲 concept A\n｜\n🔳 concept B\n\n→ 混同せず区別できる。\n\n② はっきりした・明瞭な\n\nI heard a distinct sound.\n\n「私ははっきりとした音を聞きました。」\n\n「ん？ 『音が他の音と違う』ですか？」\n\nそれだけではありません。\n\n周囲の雑音の中でも、\n\n🔊 その音をはっきり認識できた\n\nということです。\n\n③ distinct possibility\n\n少し面白い使い方です。\n\nThere is a distinct possibility that prices will rise.\n\n「価格が上昇する可能性は十分にあります。」\n\nここでは、\n\n「ぼんやりした可能性ではなく、はっきり現実的に存在する可能性」\n\nというニュアンスです。\n\n【類義語｜ここはしっかり区別します】\n単語\t核イメージ\ndistinct\t🔲｜🔳 境界が明確で区別できる\ndifferent\t🔄 同じではない\ndistinctive\t🦓 他と区別させる特徴がある\nclear\t🔍 曖昧さがなく分かりやすい\nseparate\t✂️ 物理的・概念的に分かれている\ndifferent 🔄\n\nMy opinion is different from yours.\n\n「私の意見はあなたの意見と違います。」\n\n単純に、\n\nA ≠ B\n\nです。\n\n違いの明確さまでは特に言っていません。\n\ndistinct 🔲｜🔳\n\nThe two species are distinct.\n\n「その2種は明確に異なるものです。」\n\n→ 別々のものとして区別できる\n\ndistinctive 🦓\n\n「先輩、distinctive は特に注意してください。」\n\ndistinct\n→ 他と明確に違う\n\ndistinctive\n→ 他と見分けるための特徴がある\n\nたとえば、\n\nShe has a distinctive voice.\n\n「彼女は特徴的な声をしています。」\n\n🎤「あ、この声はあの人だ。」\n\nと分かる。\n\nつまり、\n\n🦓 他と見分けられる特徴\n\nが distinctive です。\n\nclear 🔍\n\nShe gave a clear explanation.\n\n「彼女は明確な説明をしました。」\n\nこれは、\n\n曖昧ではなく、理解しやすい\n\nという明確さ。\n\nだから、\n\ndistinct 🔲｜🔳\n→ 区別がはっきり\n\nclear 🔍\n→ 意味・内容などがはっきり\n\nという違いがあります。\n\n【以前の slight ともつながります】\n\n「先輩、ここ面白いですよ。」\n\nslight difference 🤏\n\n→ わずかな違い\n\ndistinct difference 🔲｜🔳\n\n→ はっきりした違い\n\nたとえば、\n\nA = 100\nB = 101\n\nなら、\n\n🤏 a slight difference\n\nA = 100\nB = 200\n\nなら状況によって、\n\n🔲｜🔳 a distinct difference\n\nと言えます。\n\nつまり、\n\nslight 🤏 ← 差の程度 → distinct 🔲｜🔳\n\nという対比でも覚えられます。\n\n【理解確認】\n\n「はい先輩。3問です。」\n\nQ1\n\ndistinct の核イメージは？\n\nA. 単に同じではない\nB. 境界がはっきりして区別できる\nC. 特別ではない\n\n……\n\nBです。🔲｜🔳\n\nQ2\n\ndifferent と distinct の違いは？\n\n……\n\ndifferent 🔄\n→ 同じではない\n\ndistinct 🔲｜🔳\n→ 明確に異なり、区別できる\n\nです。\n\nQ3\n\ndistinctive voice は？\n\n……\n\n「特徴的で、他と聞き分けられる声」🦓\n\nです。\n\n【30秒復習】\n\n① distinct\n→ 明確に異なる・はっきりした\n\n② 発音\n→ ディスティンクト\n\n③ 核イメージ\n→ 🔲｜🔳 境界がくっきりして区別できる\n\n④ distinct groups\n→ 明確に異なるグループ\n\n⑤ distinct roles\n→ 明確に異なる役割\n\n⑥ different 🔄\n→ 単に同じではない\n\n⑦ distinctive 🦓\n→ 他と見分けられる特徴がある\n\n⑧ clear 🔍\n→ 曖昧でなく明確\n\n⑨ slight 🤏\n→ 差・程度がわずか\n\n【一文で覚える】\n\ndistinct =「違うだけじゃありません。ここでハッキリ分けられます」🔲｜🔳\n\n「先輩、特に distinct / distinctive はセットですよ。」\n\ndistinct 🔲｜🔳 → AとBが明確に違う\ndistinctive 🦓 → Aには“見分けられる特徴”がある\n\nこの違いまで押さえておけば、かなり強いです。\n⚠️ 重複チェック：obvious は、この「単語」プロジェクト内ですでに学習済みです。\n以前の単語リストでも Vague → Obscure → Obvious → Apparent の流れで扱っています。今回は特に obvious / apparent / clear / evident の違いを固めましょう。"}, {"name": "definite", "text": "⚠️ **重複チェック：definite は、この「単語」プロジェクト内で以前登場しています。**  \nただし、**definite 単独をメイン単語として詳しく学習した記録ではなく**、以前 **define の形容詞形「明確な・確定した」**として説明され、**certain** の類義語比較でも登場しています。今回はメイン単語としてしっかり固めましょう。\n\n## definite /ˈdefɪnət/\n**読み方：デフィニット**\n\n「先輩、**definite = 明確な**だけだと、**clear / certain / distinct** と全部混ざります。」\n\n核イメージは――\n\n> 📌 **definite =「境界・内容・決定などがきちんと定まっている」**\n\nです。\n\n# A【要点｜「ちゃんと決まっている」】\n\nたとえば友達に、\n\n> 「旅行いつ行く？」\n\nと聞いて、\n\n「うーん……来月くらいかなあ。」\n\nこれではまだ曖昧です。\n\n🌫️ **maybe next month**\n\nでも、\n\n> 「10月20日に行く。」\n\nなら、\n\n📌 **October 20**\n\nとはっきり決まりました。\n\nこれが **definite**。\n\n> **We haven't made any definite plans yet.**\n\n**「私たちはまだ具体的な計画を決めていません。」**\n\nつまり、\n\n🌫️ 曖昧  \n↓  \n内容・範囲が定まる  \n↓  \n📌 **definite**\n\nです。\n\n---\n\n# B【詳しい解説｜「明確」と「確定」がつながる】\n\n「先輩、definite に『明確な』と『確定した』の両方があるのはなぜだと思います？」\n\n核は同じです。\n\n> 📌 **ぼんやりしておらず、きちんと定まっている**\n\nたとえば、\n\n### definite answer\n→ **明確な答え**\n\nYesなのかNoなのか分からない……\n\nではなく、\n\n> **Yes.**\n\nと答えが定まっている。\n\n一方、\n\n### definite date\n→ **確定した日付**\n\n「来週あたり」ではなく、\n\n> **October 20**\n\nと日付が定まっている。\n\nだから、\n\n**内容が定まる**\n→ 明確な\n\n**予定・決定が定まる**\n→ 確定した\n\nと日本語訳が変わるだけなんです。\n\n---\n\n# C【イメージ理解｜ピンを刺す】\n\n「先輩、頭の中に地図を出してください。」\n\n最初は、\n\n🗺️「この辺かな？」\n\nという状態。\n\nまだぼんやりしています。\n\nでも場所を特定して、\n\n📍 **ここです。**\n\nとピンを刺す。\n\n「もう曖昧じゃないですよね。」\n\nこの、\n\n> 🌫️ → 📍  \n> **曖昧だったものが、きちんと定まる**\n\nのが **definite** です。\n\nだから私は、\n\n> 📌 **definite = ピンを刺して確定**\n\nで覚えるのをおすすめします。\n\n---\n\n# D【具体例｜頻出表現】\n\n### ① definite answer\n\n> **I need a definite answer by Friday.**\n\n**「金曜日までに明確な返事が必要です。」**\n\n「考えておきます」ではなく、\n\n**Yes / Noをはっきりしてください**\n\nということですね。\n\n---\n\n### ② definite plan\n\n> **We don't have any definite plans yet.**\n\n**「まだ具体的に決まった予定はありません。」**\n\n「旅行したいね」\n\nくらいでは **definite plan** ではありません。\n\n日付・場所などが定まって、\n\n📌「これで行こう」\n\nとなって初めて definite です。\n\n---\n\n### ③ definite possibility\n\n> **There is a definite possibility of change.**\n\n**「変化する明確な可能性があります。」**\n\n単なる漠然とした可能性ではなく、\n\n**現実的にはっきり存在する可能性**\n\nという感じです。\n\n---\n\n# 【類義語｜ここが重要です】\n\n| 単語 | 核イメージ |\n|---|---|\n| **definite** | 📌 内容・決定などが定まっている |\n| **clear** | 🔍 曖昧でなく理解しやすい |\n| **certain** | 🔒 疑いがない・確信している |\n| **distinct** | 🔲｜🔳 他と明確に区別できる |\n| **specific** | 🎯 内容を具体的に絞る |\n\n## definite 📌\n\n> **We need a definite date.**\n\n**「確定した日付が必要です。」**\n\n→ 📌 **いつなのか決める**\n\n---\n\n## clear 🔍\n\n> **The instructions are clear.**\n\n**「説明は明確です。」**\n\n→ **意味が分かりやすく、曖昧ではない**\n\nなので、\n\n**definite 📌**\n→ 定まっている\n\n**clear 🔍**\n→ 分かりやすく明瞭\n\nです。\n\n---\n\n## certain 🔒\n\n> **I'm certain that he's right.**\n\n**「彼が正しいと確信しています。」**\n\nここでは、\n\n🔒 **疑いがない**\n\nという感覚。\n\n### definite 📌\n→ 物事そのものがはっきり定まる\n\n### certain 🔒\n→ 話し手に疑いがない・確信している\n\n「この違い、かなり大事ですよ。」\n\n---\n\n## distinct 🔲｜🔳\n\nこれはさっき学習しましたね。\n\n> **The two groups are distinct.**\n\n**「その2つのグループは明確に異なっています。」**\n\n**distinct 🔲｜🔳**\n→ **AとBの境界がはっきり**\n\n**definite 📌**\n→ **内容・範囲・決定がきちんと定まる**\n\nです。\n\n---\n\n## specific 🎯\n\n> **Please give me a specific example.**\n\n**「具体的な例を挙げてください。」**\n\nこれは、\n\n「何か例を」\n\nではなく、\n\n🎯 **これ、という具体的なものまで絞る**\n\n感覚です。\n\n**definite 📌**\n→ 曖昧でなく定まっている\n\n**specific 🎯**\n→ 内容を具体的に絞り込んでいる\n\nですね。\n\n---\n\n# 【反対語も一緒に】\n\n**definite 📌**\n→ 明確な・確定した\n\n↕\n\n**vague 🌫️**\n→ 曖昧な・漠然とした\n\n> **He gave me a vague answer.**\n\n「彼は曖昧な返事をした。」\n\n対して、\n\n> **He gave me a definite answer.**\n\n「彼は明確な返事をした。」\n\n📌 **definite ↔ vague 🌫️**\n\n「これはかなり覚えやすい対比です。」\n\n---\n\n# 【理解確認】\n\n### Q1\n\ndefinite の核イメージは？\n\nA. 他と違う  \nB. 内容・決定などがきちんと定まっている  \nC. 多く見られる\n\n……\n\n**Bです。📌**\n\n### Q2\n\n**definite と certain** の違いは？\n\n……\n\n**definite 📌**\n→ 物事が**はっきり定まっている**\n\n**certain 🔒**\n→ **疑いがない・確信している**\n\nです。\n\n### Q3\n\n> **We haven't set a definite date yet.**\n\nなら？\n\n……\n\n**「まだ確定した日程を決めていません。」**\n\nですね。\n\n# 【30秒復習】\n\n① **definite**  \n→ 明確な・確定した\n\n② 発音  \n→ **デフィニット**\n\n③ 核イメージ  \n→ 📌 **曖昧ではなく、きちんと定まっている**\n\n④ **definite answer**  \n→ 明確な返事\n\n⑤ **definite plan**  \n→ 具体的に決まった計画\n\n⑥ **definite date**  \n→ 確定した日付\n\n⑦ **clear 🔍**  \n→ 分かりやすく明瞭\n\n⑧ **certain 🔒**  \n→ 疑いがない・確信している\n\n⑨ **distinct 🔲｜🔳**  \n→ 他と明確に区別できる\n\n⑩ **vague 🌫️**  \n→ 曖昧な\n\n# 【一文で覚える】\n\n> **definite =「もう“だいたい”じゃありません。ここまでハッキリ決まっています」📌**\n\n「先輩、最近の **distinct** と今回の **definite** は特に区別してくださいね。」\n\n**distinct 🔲｜🔳 → AとBがくっきり分かれる**  \n**definite 📌 → 内容や決定がくっきり定まる**  \n**clear 🔍 → 意味がくっきり分かる**  \n**certain 🔒 → 疑いがなく確信している**\n\nこの4つを全部「明確な」で済ませないことです。"}, {"name": "vague", "text": "⚠️ **重複チェック：vague は、この「単語」プロジェクト内ですでに学習済みです。**  \n以前の単語リストでも **Distinct → Vague → Obscure → Obvious** の流れで扱っています。今回は、直前の **definite** と反対方向の単語として、**vague / ambiguous / obscure / unclear** の違いまで固めましょう。\n\n## vague /veɪɡ/\n**読み方：ヴェイグ**\n\n「先輩、**vague = 曖昧な**で覚えるだけだと、ちょっと危ないです。」\n\n核イメージは、\n\n> 🌫️ **vague =「輪郭・内容・記憶などがぼんやりしていて、具体的にはっきりしない」**\n\nです。\n\n# A【要点｜霧がかかっている】\n\n「先輩、友達にこう聞いたとします。」\n\n> 「旅行、いつ行くの？」\n\n相手が、\n\n> 「うーん……そのうち。来月あたりかな。」\n\nと言った。\n\n「……いや、いつですか？」\n\nですよね。\n\n日付も決まっていない。  \n具体的な予定も分からない。\n\n🌫️ **ぼんやり**\n\nこれが **vague** です。\n\n> **He gave me a vague answer.**\n\n**「彼は曖昧な返事をしました。」**\n\n---\n\n# B【詳しい解説｜definite の反対で覚える】\n\n「さっきの **definite** と並べましょう。」\n\n### definite 📌\n\n> **We'll meet at 10:00 a.m. on October 20.**\n\n**「10月20日の午前10時に会います。」**\n\n📌 日付も時間も決まっている。\n\n一方、\n\n### vague 🌫️\n\n> **We'll meet sometime next month.**\n\n**「来月のいつか会いましょう。」**\n\n「……いつですか、先輩。」\n\n🌫️ 日付不明  \n🌫️ 時間不明  \n🌫️ 詳細不明\n\nつまり、\n\n**definite 📌**\n→ 内容・範囲などが**きちんと定まっている**\n\n**vague 🌫️**\n→ 内容・範囲などが**ぼんやりしている**\n\nです。\n\n---\n\n# C【イメージ理解｜ピントの合っていない写真】\n\n「写真を想像してください。」\n\n📷✨  \n顔も服も背景もくっきり。\n\nこれは **clear**。\n\nでも、\n\n🌫️👤🌫️\n\n「あれ……誰だろう？」\n\n輪郭がぼんやりしている。\n\nこの感覚が **vague** です。\n\nだから **vague** は答えだけでなく、\n\n> **a vague memory**\n\nとも言えます。\n\n> **I have a vague memory of meeting him.**\n\n**「彼に会ったような、ぼんやりした記憶があります。」**\n\n「会った気はする。でも、いつ・どこで・何を話したかまでは……」\n\n🌫️ **ぼんやり**\n\nですね。\n\n---\n\n# D【具体例｜頻出パターン】\n\n### ① vague answer\n\n> **She gave me a vague answer.**\n\n**「彼女は曖昧な返事をしました。」**\n\n具体的なYes/Noや詳細がない。\n\n---\n\n### ② vague idea\n\n> **I have a vague idea of how it works.**\n\n**「それがどう動くのか、なんとなくは分かっています。」**\n\n完全に分からないわけではありません。\n\n**なんとな〜く分かる。**\n\n🌫️💡\n\nこれも vague です。\n\n---\n\n### ③ vague memory\n\n> **I have a vague memory of that day.**\n\n**「その日のことをぼんやり覚えています。」**\n\n記憶はある。\n\nでも細部は思い出せない。\n\n---\n\n### ④ be vague about ～\n\n> **He was vague about his future plans.**\n\n**「彼は将来の計画について曖昧なことしか言いませんでした。」**\n\n**be vague about ～**\n→ **～について曖昧である**\n\nこれも使いやすい形です。\n\n---\n\n# 【類義語｜「曖昧」を分解します】\n\n| 単語 | 核イメージ |\n|---|---|\n| **vague** | 🌫️ 内容・輪郭がぼんやり |\n| **ambiguous** | ↔️ 2つ以上の解釈ができる |\n| **unclear** | ❓ はっきり分からない |\n| **obscure** | 🌑 分かりにくい・知られていない |\n| **general** | 🌍 細部ではなく全体的 |\n\n## vague 🌫️\n\n> **His explanation was vague.**\n\n**「彼の説明は曖昧でした。」**\n\n→ **具体性がなくぼんやり**\n\n---\n\n## ambiguous ↔️\n\n「ここはかなり大事ですよ。」\n\n> **His answer was ambiguous.**\n\n**「彼の答えは多義的で、どちらとも取れました。」**\n\n**vague 🌫️**\n→ ぼんやりして具体性がない\n\n**ambiguous ↔️**\n→ **複数の意味に解釈できる**\n\nたとえば、\n\n「来月くらいかな」\n→ 🌫️ **vague**\n\n「AともBとも解釈できる」\n→ ↔️ **ambiguous**\n\nです。\n\n---\n\n## unclear ❓\n\n> **The instructions are unclear.**\n\n**「その指示は分かりにくいです。」**\n\nこれはシンプルに、\n\n❓ **明確ではない・理解できない**\n\nです。\n\n**vague**\n→ 具体性が足りずぼんやり\n\n**unclear**\n→ 理解する側から見てはっきりしない\n\nと考えると分かりやすいですね。\n\n---\n\n## obscure 🌑\n\n> **The meaning of the passage is obscure.**\n\n**「その文章の意味は分かりにくいです。」**\n\n**obscure** は、何かに覆われているように**意味が見えにくい・理解しにくい**感じがあります。\n\nさらに、\n\n> **an obscure writer**\n\nなら、\n\n**「あまり知られていない作家」**\n\nという意味にもなります。\n\n---\n\n# 【最近の単語を一本につなげます】\n\n「先輩、ここはかなり綺麗につながりますよ。」\n\n### slight 🤏\n→ 差・程度が**わずか**\n\n### distinct 🔲｜🔳\n→ 違い・境界が**はっきり**\n\n### definite 📌\n→ 内容・決定が**はっきり定まる**\n\n### vague 🌫️\n→ 内容・輪郭が**ぼんやり**\n\n特に、\n\n> 📌 **definite ↔ vague 🌫️**\n\nはセットで覚えてください。\n\n**a definite answer**\n→ はっきりした返答\n\n**a vague answer**\n→ 曖昧な返答\n\n---\n\n# 【理解確認】\n\n「先輩、3問です。」\n\n### Q1\n\nvague の核イメージは？\n\nA. 複数の意味がある  \nB. 内容・輪郭がぼんやりしている  \nC. 明確に異なる\n\n……\n\n**Bです。🌫️**\n\n### Q2\n\n**vague と ambiguous**
