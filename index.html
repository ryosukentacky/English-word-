 の違いは？\n\n……\n\n**vague 🌫️**\n→ **ぼんやりして具体性がない**\n\n**ambiguous ↔️**\n→ **複数の解釈ができる**\n\nです。\n\n### Q3\n\n> **I have a vague memory of him.**\n\nなら？\n\n……\n\n**「彼についてぼんやりとした記憶があります。」**\n\nつまり、\n\n「覚えてはいるんです。でも細かいところまでは……」\n\nですね。\n\n# 【30秒復習】\n\n① **vague**  \n→ 曖昧な・漠然とした\n\n② 発音  \n→ **ヴェイグ**\n\n③ 核イメージ  \n→ 🌫️ **輪郭・内容がぼんやり**\n\n④ **vague answer**  \n→ 曖昧な返事\n\n⑤ **vague idea**  \n→ 漠然とした考え\n\n⑥ **vague memory**  \n→ ぼんやりした記憶\n\n⑦ **ambiguous ↔️**  \n→ 複数の解釈ができる\n\n⑧ **unclear ❓**  \n→ はっきり分からない\n\n⑨ **obscure 🌑**  \n→ 分かりにくい・あまり知られていない\n\n⑩ **definite 📌**  \n→ はっきり定まっている\n\n# 【一文で覚える】\n\n> **vague =「何となくは分かるんですけど……輪郭がぼんやりしてるんですよね」🌫️**\n\n「先輩、ここは対比で一気に覚えましょう。」\n\n**definite 📌 → ピンを刺せるほど定まっている**  \n**vague 🌫️ → 霧がかかってぼんやり**  \n**ambiguous ↔️ → AにもBにも解釈できる**  \n**obscure 🌑 → 意味が見えにくい**\n\n「全部『曖昧』と訳されることがありますけど、頭の中の景色はちゃんと違いますからね。」"}, {"name": "obvious", "text": "obvious /ˈɑːbviəs/\n\n読み方：オブヴィアス\n\n「先輩、obvious = 明らかなだけで終わらせないでくださいね。」\n\n核イメージは、\n\n👀💡 obvious =「隠れていない。見れば・考えれば、誰でもすぐ分かるほど明らか」\n\nです。\n\nA【要点｜「見れば分かるでしょ？」】\n\n「先輩、外を見たらこうだったとします。」\n\n☔☔☔\n🌧️ザーザー\n\nそこで私が、\n\nIt's obvious that it's raining.\n\nと言った。\n\n「……まあ、見れば分かりますよね。」\n\nこれが obvious です。\n\n証拠を集めて難しく推理する必要はありません。\n\n情報を見る\n↓\n答えがほぼそのまま見えている\n↓\n👀「明らかですよね」\n↓\nobvious\n\nです。\n\nB【詳しい解説｜「明らか」ってどういうこと？】\n\nたとえば試験結果を見た人が、\n\n😄「やった！」\n\nと飛び跳ねている。\n\n先輩が、\n\n「あの人、うれしいのかな？」\n\nと言ったら……\n\n「先輩。たぶん、というか……obvious ですよね。」\n\nIt was obvious that she was happy.\n\n「彼女が喜んでいるのは明らかでした。」\n\n表情\n↓\n声\n↓\n行動\n↓\n全部が「うれしい」と示している\n\nだから、\n\n👀 誰が見ても分かるほど明白\n\nなんです。\n\nC【イメージ理解｜答えが丸見え】\n\n「クイズを想像してください。」\n\nQ. 日本の首都は？\n\nA. 東京\nB. パリ\nC. ロンドン\n\n先輩「Aかな……？」\n\n「そこは迷わないでください。」\n\n答えがほぼ丸見えですよね。\n\n💡 The answer is obvious.\n\n「答えは明らかです。」\n\n頭の中では、\n\n❓ → 長く考える\n\nではなく、\n\n👀 → 💡 「見れば分かる」\n\nこれが obvious です。\n\nD【具体例｜頻出表現】\n① It is obvious that ～\n\nこれは重要です。\n\nIt is obvious that something is wrong.\n\n「何かがおかしいのは明らかです。」\n\nIt is obvious that S + V\n→ ～なのは明らかだ\n\nですね。\n\n② obvious difference\n\nThere is an obvious difference between the two products.\n\n「その2つの製品には明らかな違いがあります。」\n\nパッと比較して、\n\nA 🔴　　B 🔵\n\n「違いますよね。」\n\nと分かるレベルです。\n\n③ obvious reason\n\nHe left for an obvious reason.\n\n「彼が去った理由は明らかでした。」\n\n理由が隠れておらず、簡単に理解できる。\n\n④ obviously\n\n副詞も非常によく使います。\n\nShe was obviously nervous.\n\n「彼女は明らかに緊張していました。」\n\n手が震える、声が震える、落ち着かない……\n\n👀「緊張してるな」\n\nと分かる。\n\nobvious\n→ 形容詞「明らかな」\n\nobviously\n→ 副詞「明らかに」\n\nです。\n\n【類義語｜「明らか」を分けます】\n単語\t核イメージ\nobvious\t👀 誰でもすぐ分かるほど明白\nclear\t🔍 曖昧さがなく明確\napparent\t👁️ 見たところ明らか・明らかになった\nevident\t🧾 証拠・状況から明らか\ndistinct\t🔲｜🔳 他と明確に区別できる\nobvious 👀\n\nIt was obvious that he was lying.\n\n「彼が嘘をついているのは明らかでした。」\n\n→ 👀 誰が見ても分かるレベル\n\n「先輩、嘘が下手すぎるんですよ。」\n\nclear 🔍\n\nThe instructions are clear.\n\n「指示は明確です。」\n\nこれは、\n\n🌫️ 曖昧ではない\n↓\n🔍 内容がはっきり理解できる\n\nという意味。\n\nobvious 👀\n\n→ 分かるのが簡単\n\nclear 🔍\n\n→ 内容に曖昧さがない\n\nです。\n\nevident 🧾\n\nIt was evident from the data that sales were falling.\n\n「データから、売上が落ちていることは明らかでした。」\n\nここでは、\n\n📊 データ\n↓\n📉 売上低下\n↓\n🧾 証拠から明らか\n\nという感じです。\n\nobvious 👀\n→ 見ればすぐ分かる\n\nevident 🧾\n→ 証拠・事実から明らか\n\napparent 👁️\n\nIt became apparent that the plan had failed.\n\n「その計画が失敗したことが明らかになりました。」\n\napparent は、\n\n👁️ 見たところ明らかな／状況から明らかになった\n\nという感覚があります。\n\nただし注意。\n\napparent\n\nには文脈によって、\n\n「一見したところの・見かけ上の」\n\nという意味もあります。\n\nHis apparent confidence was actually nervousness.\n\nなら、\n\n「彼の見かけ上の自信は、実は緊張だった。」\n\nつまり、\n\n👁️ そう見える\n\nというニュアンスを持てるんです。\n\nここは obvious との大きな違いですね。\n\n【最近の単語を一本につなげます】\n\n「先輩、かなりきれいなグループができてきました。」\n\nvague 🌫️\n→ ぼんやりしている\n\ndefinite 📌\n→ 内容・決定が定まっている\n\ndistinct 🔲｜🔳\n→ AとBを明確に区別できる\n\nobvious 👀\n→ 誰が見てもすぐ分かる\n\nたとえば、\n\nan obvious difference\n\nなら、\n\n👀 見ればすぐ分かる違い\n\na distinct difference\n\nなら、\n\n🔲｜🔳 明確に区別できる違い\n\nです。\n\nかなり意味は近づきますが、**obvious は「気づきやすさ」**が強い、と考えると分かりやすいですよ。\n\n【理解確認】\nQ1\n\nobvious の核イメージは？\n\nA. 内容がぼんやりしている\nB. 誰でもすぐ分かるほど明らか\nC. 複数の解釈ができる\n\n……\n\nBです。👀\n\nQ2\n\nobvious と clear の違いは？\n\n……\n\nobvious 👀\n→ 見ればすぐ分かる\n\nclear 🔍\n→ 曖昧さがなく明確\n\nです。\n\nQ3\n\nShe was obviously angry.\n\nなら？\n\n……\n\n「彼女が怒っているのは明らかだった。」\n\nですね。\n\n😡💢\n\n「……これは声をかける前に気づいてくださいね、先輩。」\n\n【30秒復習】\n\n① obvious\n→ 明らかな・明白な\n\n② 発音\n→ オブヴィアス\n\n③ 核イメージ\n→ 👀 見ればすぐ分かるほど明白\n\n④ It is obvious that ～\n→ ～なのは明らかだ\n\n⑤ obvious difference\n→ 誰でも分かる明らかな違い\n\n⑥ obviously\n→ 明らかに\n\n⑦ clear 🔍\n→ 曖昧さがなく明確\n\n⑧ evident 🧾\n→ 証拠・状況から明らか\n\n⑨ apparent 👁️\n→ 見たところ明らか／明らかになった\n\n⑩ vague 🌫️\n→ ぼんやりして曖昧\n\n【一文で覚える】\n\nobvious =「先輩、これ……見れば分かりますよね？」👀💡\n\nvague 🌫️ → ぼんやりして分からない\nclear 🔍 → 曖昧さがなく分かる\nevident 🧾 → 証拠から分かる\napparent 👁️ → 見たところ分かる\nobvious 👀 → 誰でもすぐ分かる\n\n「特に **obvious =『明らか』ではなく、『明らかすぎて簡単に気づける』**までイメージしてください。そこまで入れば、もう訳語に頼らなくて済みますよ。」"}, {"name": "respect", "text": "⚠️ **重複チェック：respect は、この「単語」プロジェクト内ですでに登場しています。**  \n特に **respectively** を学習した際にも語源的につながる語として扱っています。今回は **respect = 尊敬** だけでなく、重要な **「点・観点」「尊重する」** までまとめて固めましょう。\n\n## respect /rɪˈspekt/\n**読み方：リスペクト**\n\n「先輩、日本語でも『リスペクトする』って言いますよね。でも英語の **respect** はそれより範囲が広いんです。」\n\n核イメージは、\n\n> 👀 **respect =「相手・物事をきちんと見て、その価値や重要性を認める」**\n\nここから、\n\n**① 尊敬する・尊重する【動詞】**  \n**② 尊敬・尊重【名詞】**  \n**③ 点・観点・面【名詞】**\n\nへ広がります。\n\n# A【要点｜相手をちゃんと見る】\n\nたとえば先輩に、長年努力して技術を身につけた人がいるとします。\n\nその人の、\n\n努力  \n↓  \n能力  \n↓  \n実績\n\nをきちんと認めて、\n\n> 「この人はすごい。」\n\nと思う。\n\nこれが、\n\n> **I respect him.**\n\n**「私は彼を尊敬しています。」**\n\nです。\n\nただ「好き」ということではありません。\n\n> 👀 **その人の価値・能力・考えなどを認めて大切に扱う**\n\nのが **respect** です。\n\n---\n\n# B【詳しい解説｜「尊敬」と「尊重」】\n\n「先輩、ここは日本語訳を分けましょう。」\n\n### 人の能力・人格を認める\n\n> **I respect my teacher.**\n\n**「私は先生を尊敬しています。」**\n\n🏅 **尊敬する**\n\nですね。\n\n一方、\n\n> **We must respect other people's opinions.**\n\nなら、\n\n**「他人の意見を尊重しなければなりません。」**\n\n「他人の意見を尊敬する」だと少し変ですよね。\n\nここでは、\n\n自分とは違う意見がある  \n↓  \nでも、その意見を無価値として扱わない  \n↓  \n相手の考えとしてきちんと認める  \n↓  \n🤝 **尊重する**\n\nです。\n\nつまり **respect** は、\n\n> 👀 **「価値・権利・考えをちゃんと認めて扱う」**\n\nというところで「尊敬」と「尊重」がつながっています。\n\n---\n\n# C【イメージ理解｜「好きじゃなくても respect できる」】\n\n「ここ、かなり重要ですよ。」\n\n先輩とAさんは意見が正反対。\n\n先輩：\n「私はAだと思う。」\n\nAさん：\n「私はBだと思う。」\n\n先輩はAさんに同意できない。\n\nでも、\n\n> 「考えは違う。でも、あなたがそう考える権利は認めます。」\n\nと言える。\n\nこれも、\n\n> **I respect your opinion.**\n\nです。\n\nつまり、\n\n❤️ **like**\n→ 好き\n\n👍 **agree**\n→ 同意する\n\n👀🤝 **respect**\n→ 価値・立場・権利などを認める\n\n「**respect = 好き・同意する、ではない**んですよ。」\n\n---\n\n# D【具体例｜実は「観点」という意味もあります】\n\n### ① respect someone\n\n> **I really respect her.**\n\n**「私は彼女を本当に尊敬しています。」**\n\n---\n\n### ② respect someone's decision\n\n> **I respect your decision.**\n\n**「あなたの決定を尊重します。」**\n\n「私はその決定に賛成です」とは限りません。\n\n**あなた自身が下した決定として認めます**\n\nということです。\n\n---\n\n### ③ show respect for ～\n\n> **We should show respect for others.**\n\n**「私たちは他人に敬意を示すべきです。」**\n\n**show respect for ～**\n→ **～に敬意を示す**\n\nこれはセットで覚えてください。\n\n---\n\n### ④ in this respect\n\n「先輩、これがかなり重要な別の意味です。」\n\n> **The two systems are similar in this respect.**\n\n**「この点では、その2つのシステムは似ています。」**\n\nここでの **respect** は、\n\n❌ 尊敬\n\nではありません。\n\n> 🔎 **点・面・観点**\n\nです。\n\n**in this respect**\n→ **この点では**\n\nこれは文章やニュースでも使いやすい表現です。\n\n---\n\n### ⑤ with respect to ～\n\n> **With respect to cost, this plan is better.**\n\n**「コストに関しては、この計画のほうが優れています。」**\n\n**with respect to ～**\n→ **～に関して**\n\nです。\n\n---\n\n# 【類義語｜respect / admire / appreciate】\n\n「はい先輩。ここを全部『尊敬する』にしないでください。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **respect** | 👀🤝 価値・能力・権利を認める |\n| **admire** | ✨ すごい・素敵だと感心する |\n| **look up to** | 👆 人を尊敬して見上げる |\n| **appreciate** | 💎 価値・ありがたさを理解する |\n| **honor** | 🎖️ 敬意を示し称える |\n\n## respect 👀🤝\n\n> **I respect his honesty.**\n\n**「私は彼の誠実さを尊敬しています。」**\n\n→ その価値を**認めている**\n\n---\n\n## admire ✨\n\n> **I admire her courage.**\n\n**「私は彼女の勇気に感心しています。」**\n\n「すごいなあ」\n\nと**感嘆・称賛する気持ち**が強いです。\n\n### respect 👀\n→ 価値を認める\n\n### admire ✨\n→ 素晴らしいと感心する\n\nですね。\n\n---\n\n## look up to 👆\n\n> **I've always looked up to my father.**\n\n**「私はずっと父を尊敬してきました。」**\n\nこれは文字通り、\n\n👆 **見上げる**\n\nイメージ。\n\n**尊敬する人物・憧れの人物として見る**感じがあります。\n\n---\n\n## appreciate 💎\n\n> **I appreciate your help.**\n\n**「助けてくれて感謝しています。」**\n\nこれは、\n\n💎 **価値・ありがたさをちゃんと理解する**\n\nという感覚です。\n\n**respect a person**\n→ その人の価値・能力を認める\n\n**appreciate someone's help**\n→ 助けのありがたさを認識する\n\nという違いですね。\n\n---\n\n# 【respectivelyとのつながり】\n\n「以前学習した **respectively** ともつなげておきます。」\n\n> **Tom and Mary are 20 and 25, respectively.**\n\n**「トムとメアリーは、それぞれ20歳と25歳です。」**\n\n**respectively**\n→ **それぞれ・各々**\n\nこれは現代英語では一つの副詞として覚えるのが実用的ですが、**respect** には「点・事項・関係」といった意味の広がりがあることも覚えておくと、関連語を整理しやすくなります。\n\n---\n\n# 【理解確認】\n\n### Q1\n\nrespect の核イメージは？\n\nA. 好きになる  \nB. 価値・能力・権利などを認める  \nC. 同意する\n\n……\n\n**Bです。👀🤝**\n\n### Q2\n\n> **I respect your opinion.**\n\nは、\n\n「あなたの意見に賛成です」\n\nでしょうか？\n\n……\n\n**違います。**\n\n**「あなたの意見を尊重します。」**\n\nです。\n\n同意していなくても respect はできます。\n\n### Q3\n\n> **in this respect**\n\nは？\n\n……\n\n**「この点では」🔎**\n\nです。\n\n「ここで『この尊敬では』なんて訳さないでくださいね。」\n\n# 【30秒復習】\n\n① **respect**  \n→ 尊敬する・尊重する／尊敬・敬意／点・観点\n\n② 発音  \n→ **リスペクト**\n\n③ 核イメージ  \n→ 👀 **価値・重要性をきちんと認める**\n\n④ **respect someone**  \n→ 人を尊敬する\n\n⑤ **respect someone's opinion**  \n→ 人の意見を尊重する\n\n⑥ **show respect for ～**  \n→ ～に敬意を示す\n\n⑦ **in this respect**  \n→ この点では\n\n⑧ **with respect to ～**  \n→ ～に関して\n\n⑨ **admire ✨**  \n→ 素晴らしいと感心する\n\n⑩ **look up to 👆**  \n→ 人を尊敬して見上げる\n\n# 【一文で覚える】\n\n> **respect =「自分と違ってもいいんです。その人・考えの価値を、ちゃんと認めて扱います」👀🤝**\n\n「先輩、**respect = 尊敬する**だけで終わらせないでください。」\n\n**respect 👀🤝 → 価値を認める**  \n**admire ✨ → すごいと感心する**  \n**look up to 👆 → 人を尊敬・敬愛する**  \n**agree 👍 → 意見に同意する**\n\nこの違いが分かれば、**I respect your opinion, but I disagree.（あなたの意見は尊重しますが、私は反対です）**も自然に理解できますよ。"}, {"name": "aspect", "text": "aspect /ˈæspekt/\n\n読み方：アスペクト\n\n「先輩、aspect = 側面って覚えていると思います。でも日本語の『側面』も少し抽象的ですよね。」\n\n核イメージは、\n\n🔄 aspect =「1つの物事を、ある方向から見たときに見える一面」\n\nです。\n\nA【要点｜見る方向を変える】\n\n「先輩、会社を一つ想像してください。」\n\n同じ会社でも、\n\n💰 お金の面\n👥 人材の面\n💻 技術の面\n📈 成長性の面\n\nがありますよね。\n\n会社そのものは一つです。\n\nでも、\n\nどの方向から見るかによって、注目する面が変わる。\n\nこの一つ一つが aspect です。\n\nWe need to consider every aspect of the problem.\n\n「その問題のあらゆる側面を考える必要があります。」\n\nつまり、\n\n🔄「こっちから見たらどう？」\n🔄「じゃあ、こっちからは？」\n\nという感覚です。\n\nB【詳しい解説｜なぜ「側面」なの？】\n\n「たとえば先輩が転職先を考えるとします。」\n\n給料だけなら、\n\n💰「この会社がいい」\n\nでも、\n\n勤務時間を見ると\n⏰「こっちかな」\n\n仕事内容を見ると\n💼「いや、こっちかも」\n\n勤務地を見ると\n🚃「これは重要だな」\n\nとなります。\n\n全部、\n\ndifferent aspects of a job\n\n「仕事のさまざまな側面」\n\nです。\n\nつまり、\n\n一つの対象がある\n↓\n見るポイントを変える\n↓\n違う特徴が見える\n↓\n🔄 aspect\n\nなんです。\n\n「aspect = 別の物じゃありません。同じ物の“別の面”ですよ。」\n\nC【イメージ理解｜サイコロです】\n\n「サイコロを想像してください。」\n\n🎲\n\n正面から見ると「1」。\n\n横から見ると「3」。\n\n上から見ると「5」。\n\nでも全部、\n\n同じサイコロ\n\nですよね。\n\nこれが aspect のイメージにかなり近いです。\n\n🎲 対象は同じ。でも、見る面が違う。\n\nだから、\n\nfinancial aspect\n→ 💰 金銭面\n\nsocial aspect\n→ 👥 社会的側面\n\ntechnical aspect\n→ 💻 技術面\n\nとなります。\n\nD【具体例｜よく使う形】\n① aspect of ～\n\nThis is an important aspect of the job.\n\n「これはその仕事の重要な側面です。」\n\n仕事全体の中の、\n\n🔄 一つの面\n\nですね。\n\n② every aspect of ～\n\nTechnology affects every aspect of our lives.\n\n「テクノロジーは私たちの生活のあらゆる側面に影響を与えています。」\n\n仕事\n教育\n買い物\nコミュニケーション……\n\n生活をいろいろな面から見ても影響している、ということです。\n\n③ positive / negative aspects\n\nWe should consider both the positive and negative aspects of the plan.\n\n「その計画の良い面と悪い面の両方を検討すべきです。」\n\n👍 positive aspect\n👎 negative aspect\n\n「一方向だけ見て判断しない、ということですね。」\n\n④ financial aspect\n\nLet's consider the financial aspect first.\n\n「まず金銭面を検討しましょう。」\n\n計画全体ではなく、\n\n💰 お金という観点から見る\n\nということです。\n\n【類義語｜aspect / perspective / viewpoint / feature】\n\n「先輩、ここを整理すると一気に使いやすくなります。」\n\n単語\t核イメージ\naspect\t🔄 物事そのものが持つ一つの側面\nperspective\t👓 物事を見る立場・捉え方\nviewpoint\t👁️ 意見・立場としての視点\nfeature\t🔍 その物が持つ特徴\nrespect\t📍 「点・面」の意味でも使う\naspect 🔄\n\nWe examined the economic aspects of the issue.\n\n「その問題の経済的側面を検討しました。」\n\n→ 問題そのものの一つの面\n\nperspective 👓\n\nTry to see it from her perspective.\n\n「彼女の立場から考えてみてください。」\n\nこれは、\n\n👓 誰の目から見るか\n\nです。\n\nだから、\n\naspect 🔄\n→ 何の面を見るか\n\nperspective 👓\n→ どの立場から見るか\n\n「ここ、かなり大事ですよ。」\n\nviewpoint 👁️\n\nFrom my viewpoint, the plan is too risky.\n\n「私の観点では、その計画はリスクが高すぎます。」\n\n→ その人の立場・意見としての見方\n\nperspective とかなり近いですが、**viewpoint は意見・立場としての「視点」**を表しやすいです。\n\nfeature 🔍\n\nSafety is an important feature of this car.\n\n「安全性はこの車の重要な特徴です。」\n\nこれは以前の character / feature 系とつながります。\n\naspect 🔄\n→ ある方向から見た側面\n\nfeature 🔍\n→ その物が備えている特徴\n\nです。\n\n【直前の respect とつなげます】\n\n「先輩、ちょうどいいですね。」\n\n前回、\n\nin this respect\n\n→ この点では\n\nをやりました。\n\nrespect 📍\n→ 特定の「点・観点」\n\naspect 🔄\n→ 物事を構成する「側面」\n\nたとえば、\n\nThe two products are similar in this respect.\n\n「この点では2つの製品は似ています。」\n\n一方、\n\nLet's examine the safety aspect of both products.\n\n「両製品の安全面を検討しましょう。」\n\nとなります。\n\n【理解確認】\n\n「先輩、3問です。」\n\nQ1\n\naspect の核イメージは？\n\nA. 人の意見\nB. 一つの物事をある方向から見た一面\nC. 物の大きさ\n\n……\n\nBです。🔄\n\nQ2\n\naspect と perspective の違いは？\n\n……\n\naspect 🔄\n→ 何の面を見るか\n\nperspective 👓\n→ どの立場から見るか\n\nです。\n\nQ3\n\nWe need to consider all aspects of the problem.\n\nなら？\n\n……\n\n「その問題のあらゆる側面を考慮する必要があります。」\n\nですね。\n\n【30秒復習】\n\n① aspect\n→ 側面・面\n\n② 発音\n→ アスペクト\n\n③ 核イメージ\n→ 🔄 同じ物事を、ある方向から見た一面\n\n④ an aspect of ～\n→ ～の一側面\n\n⑤ every aspect of ～\n→ ～のあらゆる側面\n\n⑥ financial aspect 💰\n→ 金銭面\n\n⑦ positive / negative aspects\n→ 良い面／悪い面\n\n⑧ perspective 👓\n→ 見る人の立場・捉え方\n\n⑨ viewpoint 👁️\n→ 意見・立場としての視点\n\n⑩ feature 🔍\n→ その物が持つ特徴\n\n【一文で覚える】\n\naspect =「同じものですよ、先輩。ただ今度は“こっちの面”から見てみましょう」🔄\n\naspect 🔄 → 物事のどの面？\nperspective 👓 → 誰の立場から見る？\nfeature 🔍 → どんな特徴を持っている？\nrespect 📍 → どの点について？\n\n「aspect = 側面を日本語だけで暗記せず、サイコロをくるっと回して別の面を見る🎲。この映像で覚えてくださいね。」"}];
let current=0, tab='全文', filter='';
const names=['全文','A 要点','B 詳しい解説','C イメージ','D 具体例','類義語・復習'];
const $=id=>document.getElementById(id);
function sections(text){let lines=text.split('\n');let starts=[];for(let i=0;i<lines.length;i++){if(/^[ABCD]【/.test(lines[i]))starts.push({index:i,key:lines[i][0]});}let out={};for(let j=0;j<starts.length;j++){let a=starts[j],b=starts[j+1];out[a.key]=lines.slice(a.index,b?b.index:lines.length).join('\n').trim();}let last=starts.find(x=>x.key==='D');if(last){let tail=lines.slice(last.index);let k=tail.findIndex(x=>/^【(?:類義語|反対|ここだけ|理解確認|30秒復習|一文で覚える|最近の|以前の|直前の|significantとの|crucialとも|emphasizeとの)/.test(x));if(k>=0){out.D=tail.slice(0,k).join('\n').trim();out.extra=tail.slice(k).join('\n').trim();}}return out;}
function render(){const c=cards[current],sec=sections(c.text);$('title').textContent=`${current+1}. ${c.name}`;$('info').textContent=`収録 ${c.text.length.toLocaleString()} 文字｜原文を省略せず収録`;$('count').textContent=`${cards.length}語・全文収録`;
$('tabs').innerHTML='';for(const n of names){let b=document.createElement('button');b.textContent=n;b.className=tab===n?'active':'';b.onclick=()=>{tab=n;render()};$('tabs').appendChild(b)}
let content=tab==='全文'?c.text:tab==='類義語・復習'?(sec.extra||'このカードは全文タブでご覧ください。'):sec[tab[0]]||'このカードには対応する区分がありません。';$('content').textContent=content;
$('list').innerHTML='';cards.forEach((item,i)=>{if(filter&&!(`${item.name}\n${item.text}`.toLowerCase().includes(filter)))return;let b=document.createElement('button');b.textContent=`${i+1}. ${item.name}`;b.className=i===current?'active':'';b.onclick=()=>{current=i;render();window.scrollTo({top:0,behavior:'smooth'})};$('list').appendChild(b)});}
$('search').oninput=e=>{filter=e.target.value.trim().toLowerCase();render()};$('all').onclick=()=>{tab='全文';render()};$('prev').onclick=()=>{current=(current+cards.length-1)%cards.length;render()};$('next').onclick=()=>{current=(current+1)%cards.length;render()};render();
</script></body></html>
